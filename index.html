<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>निर्भय भारत सामाजिक संस्था - हजेरी, थंब व फेस लॉक</title>

<style>
:root{
--ink:#153f35;
--ink-light:#286b58;
--paper:#f7f4ec;
--card:#fffdf8;
--accent:#e1a329;
--accent-dark:#9b6810;
--success:#317a52;
--success-bg:#e4f3e8;
--danger:#a83232;
--danger-bg:#fbe8e4;
--warn:#96601B;
--warn-bg:#F5E9D3;
--text:#20241F;
--text-muted:#5C6459;
--border:#e4ddcc;
--radius:16px;
--shadow:0 10px 30px rgba(21,63,53,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html{-webkit-text-size-adjust:100%;}
body{
margin:0;
background:radial-gradient(circle at 10% 0%, #fffdf7 0,transparent 35%), var(--paper);
color:var(--text);
font-family: 'Noto Sans Devanagari','Inter', sans-serif;
min-height:100vh;
min-height:100dvh;
font-size:15px;
overscroll-behavior-y:none;
padding-bottom:env(safe-area-inset-bottom);
}
button, .field input, .field select, .field textarea, .search-row input, .search-row select{
min-height:44px;
}
button{font-family: 'Noto Sans Devanagari','Inter', sans-serif;cursor:pointer;touch-action:manipulation;}
h1,h2,h3,.display{font-family:'Noto Sans Devanagari', sans-serif;font-weight:700;}
.app-shell{max-width: 1240px;margin:0 auto; padding:24px 18px 72px;}
.topbar{display: flex;align-items:center; justify-content:space-between;padding:10px 0 20px;margin-bottom:22px; flex-wrap:wrap;gap:10px;}
.brand{display: flex;align-items:center;gap:10px;}
.brand-logo{width:75px;height:75px;border-radius:50%;flex:0 0 75px;object-fit:cover;background:#fff;border:2px solid var(--ink);box-shadow:0 0 0 4px rgba(225,163,41,.12),0 10px 24px rgba(21,63,53,.24);}
.brand-text .name{font-size:16px;color:var(--ink);font-weight:700;}
.brand-text .sub{font-size:12px;color:var(--accent-dark);font-weight:700;}
.who{display:flex; align-items:center;gap:12px;font-size:13px;color:var(--text-muted);}
.logout-btn{background:none;border:1px solid var(--border); border-radius:8px;padding:8px 15px;font-size:14px;color:var(--text);}
.logout-btn:hover{background:var(--card);}
.login-wrap{min-height:100dvh;display:flex;justify-content:center;align-items:center;padding:28px 18px;background:linear-gradient(135deg,#f8f5ed 0%, #e7f0e5 100%);}
.login-card{background:rgba(255,253,248,.91);backdrop-filter:blur(14px);border:1px solid rgba(21,63,53,.08); border-radius:20px;box-shadow:0 24px 70px rgba(21,63,53,.14);padding:38px 30px;width:100%;max-width:400px;}
.login-card:before{content: 'समाजासाठी • सेवेसाठी • विश्वासासाठी'; display:block;text-align:center;color:var(--accent-dark); font-size:11px;letter-spacing:3px;margin-bottom:16px;}
.login-logo{width:100px;height:100px;border-radius:50%; display:block;margin:0 auto 14px;object-fit:cover;box-shadow:0 0 0 5px rgba(225,163,41,.14),0 12px 28px rgba(21,63,53,.22);border:2px solid var(--accent);}
.login-card h1{font-size:19px;text-align:center;margin:0 0 4px;color:var(--ink);}
.login-card p.tag{text-align:center;color:var(--text-muted);font-size:13px;margin:0 0 24px;}
.role-toggle{display: flex;background:var(--paper); border-radius:10px;padding:4px;margin-bottom:20px;}
.role-toggle button{flex:1;border:none;background:none;padding:10px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-muted);}
.role-toggle button.active{background:var(--ink);color:#fff;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:13px;color:var(--text-muted); margin-bottom:5px;font-weight:500;}
.field input,.field select, .field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:12px 12px;font-size:15px;background:#fff;font-family:'Noto Sans Devanagari','Inter';color:var(--text);}
.field input:focus, .field select:focus, .field textarea:focus {outline: 2px solid var(--accent); outline-offset:1px;border-color:var(--accent);}
.btn{border:none;border-radius:10px;padding:14px 18px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
.btn-primary{background:linear-gradient(135deg, var(--ink),var(--ink-light));color:#fff;width:100%;box-shadow:0 8px 16px rgba(21,63,53,.16);}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
.btn-secondary{background:none;border:1px solid var(--border);width:100%;color:var(--text); margin-top:8px;}
.btn-bio{background:linear-gradient(135deg, #e1a329, #9b6810);color:#fff;width:100%;box-shadow:0 6px 14px rgba(225,163,41,.25);margin-top:10px;}
.btn-face{background:linear-gradient(135deg, #153f35, #317a52);color:#fff;width:100%;box-shadow:0 6px 14px rgba(21,63,53,.25);margin-top:8px;}
.login-error{color:var(--danger); font-size:13px;margin:-4px 0 14px;min-height:0;}
.link-btn{background:none;border:none;color:var(--accent-dark); font-size:13.5px;font-weight:600;width:100%;text-align:center;margin-top:14px;}
.phone-wrap{display:flex;justify-content:center;}
.phone{width:100%;max-width:460px;}
.status-card,.panel,.metric,.list-card,.ledger-entry{border:1px solid rgba(21,63,53,.07);}
.status-card{background:linear-gradient(145deg,#fffdf8,#f1f7ef);border-radius:var(--radius); box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px;}
.greet{font-size:13px;color:var(--text-muted);margin:0 0 2px;}
.greet-name{font-size:20px;margin:0 0 2px;color:var(--ink);}
.greet-center{font-size:13px;color:var(--accent-dark); font-weight:600;margin:0 0 16px;}
.status-row{display: flex; justify-content:space-between; align-items:center;padding:10px 0;border-top:1px solid var(--paper); font-size:14.5px;}
.status-row:first-of-type{border-top:none;}
.pill{font-size:12.5px;font-weight:700;padding: 4px 11px;border-radius:20px;}
.pill-done{background:var(--success-bg);color:var(--success);}
.pill-pending{background:var(--danger-bg);color:var(--danger);}
.pill-wait{background:var(--warn-bg);color:var(--warn);}
.action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.action-btn{background:var(--card); border:1px solid var(--border); border-radius:var(--radius);padding:18px 10px;text-align:center;font-weight:700;font-size:14px;color:var(--ink); display: flex; flex-direction:column; align-items:center;gap:8px;line-height:1.3;}
.action-btn:disabled {opacity:0.4;cursor:not-allowed;}
.action-btn .ic{width:32px;height:32px;border-radius: 50%;background:var(--paper); display: flex;align-items:center;justify-content:center;font-size:16px;}
.action-btn.full{grid-column:1 / -1; flex-direction:row; justify-content:center;padding:15px;}
.action-btn.accent{background:var(--ink);color:#fff;border-color:var(--ink);}
.action-btn.accent .ic{background:rgba(255,255,255,0.15);}
.list-card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);padding:6px 0;margin-bottom:16px;overflow:hidden;}
.list-item{display: flex; justify-content:space-between; align-items:center;padding:14px 18px;border-bottom:1px solid var(--paper); font-size:14.5px;font-weight:500;}
.list-item:last-child {border-bottom:none;}
.list-item button{background:none;border:none;color:var(--accent-dark); font-size:14px;font-weight:700;}
.ledger-entry{background:var(--card);border-radius:12px;box-shadow:var(--shadow); padding: 14px 16px;margin-bottom:10px;border-right:3px solid var(--accent);}
.ledger-date{font-weight:700;font-size:14px;margin-bottom:6px;}
.ledger-row{display: flex; justify-content:space-between;font-size:13px;color:var(--text-muted); padding:3px 0;gap:10px;}
.ledger-row b{color:var(--text); font-weight:600;text-align:left;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,26,20,0.55);display:flex;align-items:center; justify-content:center;z-index:50;padding:16px;}
.modal{background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;}
.modal h2{font-size:17px;margin:0 0 14px;color:var(--ink);}
.modal-close{float:left;background:none;border:none;font-size:20px;color:var(--text-muted);cursor:pointer;}
video, canvas{width:100%;border-radius:12px;background:#000;}
.cam-frame{position:relative;margin-bottom:14px;}
.face-scan-overlay{position:absolute;inset:15%;border:2px dashed var(--accent);border-radius:50%;box-shadow:0 0 0 9999px rgba(0,0,0,0.4);pointer-events:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;}
.gps-box{background:var(--paper); border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;color:var(--text-muted); font-weight:500;}
.gps-box.ok{color:var(--success);}
.gps-box.err{color:var(--danger);}
.tabbar{display: flex;gap:6px;margin-bottom:22px; flex-wrap:wrap;}
.tabbar button{background:var(--card); border:1px solid var(--border); border-radius:9px;padding:10px 16px;font-size: 13.5px;font-weight:600;color:var(--text-muted);}
.tabbar button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.tabbar button.badge-count{background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:6px;}
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:24px;}
.metric{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);padding:16px 18px;position:relative;overflow:hidden;}
.metric .num{font-family:'Poppins'; font-size:26px;font-weight:600;color:var(--ink);}
.metric .lbl{font-size:12.5px;color:var(--text-muted);margin-top:2px;font-weight:500;}
.metric.warn .num{color:var(--danger);}
.panel{background:var(--card);border-radius:var(--radius); box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
.panel h3{font-size:15px;margin:0 0 14px;display: flex; justify-content:space-between; align-items:center;flex-wrap:wrap;gap:10px;color:var(--ink);}
table{width:100%;border-collapse:collapse;font-size: 13.5px;}
th{text-align:right;color:var(--text-muted); font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);}
td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--paper);}
tr:last-child td{border-bottom:none;}
.search-row{display: flex;gap:8px;margin-bottom:14px; flex-wrap:wrap;}
.search-row input,.search-row select{border:1px solid var(--border); border-radius:8px;padding:10px 11px;font-size:14px;background:#fff;font-family: 'Noto Sans Devanagari','Inter';}
.search-row input{flex:1;min-width:180px;}
.status-tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:14px;}
.status-tag.present{background:var(--success-bg);color:var(--success);}
.status-tag.absent{background:var(--danger-bg);color:var(--danger);}
.small-btn{background:none;border:1px solid var(--border); border-radius:7px;padding:6px 12px;font-size:13px;color:var(--text); font-weight:600;}
.small-btn:hover{background:var(--paper);}
.small-btn.approve{border-color:var(--success);color:var(--success);}
.small-btn.reject{border-color:var(--danger);color:var(--danger);}
.empty{color:var(--text-muted); font-size:14px;padding:24px 4px;text-align:center;}
.profile-header{display: flex;justify-content:space-between; align-items:flex-start;margin-bottom:16px;gap:12px;}
.photo-pair{display:flex;gap:10px;margin:10px 0;}
.photo-pair figure{margin:0;flex:1;}
.photo-pair img{width:100%;border-radius:10px;background:var(--paper); aspect-ratio: 4/3;object-fit:cover;}
.photo-pair figcaption{font-size:12px;color:var(--text-muted);margin-top:4px;text-align:center;font-weight:500;}
.reg-photo-btn{display:flex;align-items:center;gap:12px;background:var(--paper); border-radius:10px;padding:10px;margin-bottom:14px;}
.reg-photo-btn img{width:56px;height:56px;border-radius:8px;object-fit:cover;}
.reg-photo-btn .ph-placeholder{width:56px;height:56px;border-radius:8px;background:var(--border); display:flex;align-items:center; justify-content:center;font-size:11px;color:var(--text-muted); text-align:center;}
.module-grid{display:grid;grid-template-columns:repeat(3,1fr); gap:14px;margin-bottom:20px;}
.module-card{padding:16px;border:1px solid var(--border); border-radius:14px;background:var(--card);}
.module-card strong{display:block;color:var(--ink); font-size:15px;margin-bottom:5px;}
.module-card p{font-size:12.5px;color:var(--text-muted);margin:0 0 13px;line-height:1.6;}
.toolbar{display: flex;align-items:center; justify-content:space-between;gap:12px;margin-bottom:14px; flex-wrap:wrap;}
.toolbar h3{margin:0;}
.notice{padding:12px 14px;border-right:3px solid var(--accent);background:#fff9e9;border-radius:10px;font-size:13px;margin-bottom:10px;}
.notice small{display:block;color:var(--text-muted);margin-top:4px;}
.task-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
.task-form .field{margin:0;}.task-form .field.full{grid-column:1 / -1;}
.task-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
.task-audio{width:100%;margin-top:9px;max-height:34px;}
.task-timer{font-family:'Poppins';font-size:13px;color:var(--danger);font-weight:700;}
.bottom-nav{display:none;}
.leadership{display:grid;grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px;margin:18px 0 2px;}
.leader-card{display:flex; flex-direction:column; align-items:center;text-align:center;gap:8px;padding:12px;border:1px solid rgba(21,63,53,.11);border-radius:14px;background:linear-gradient(145deg, rgba(255,255,255,.86), rgba(244,240,226,.75)); box-shadow:0 8px 20px rgba(21,63,53,.06);}
.leader-card img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--accent); outline:3px solid rgba(21,63,53,.72); box-shadow:0 10px 24px rgba(21,63,53,.2);}
.leader-card b{display:block;color:var(--ink);font-size:14px;}
.leader-card small{display:block;color:var(--text-muted); font-size:11.5px;line-height:1.5;}
.leader-card em{display:block;color:var(--accent-dark); font-size:11px;font-style:normal;font-weight:700;margin-top:3px;}
.leadership.dashboard-leadership{max-width:680px;margin:0 0 20px;}
.hero-welcome{display: flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;margin-bottom:18px;border:1px solid rgba(21,63,53,.1);border-radius:var(--radius);background:linear-gradient(135deg,#fffdf7,#e8f2e7); box-shadow:var(--shadow);}
.hero-welcome h2{margin: 0 0 3px;font-size:18px;}
.hero-welcome p{margin:0;color:var(--text-muted); font-size:12.5px;}
.hero-brand-logo{width:60px;height:60px; flex:0 0 60px;border-radius: 50%;object-fit:cover;border:2px solid var(--accent); box-shadow:0 6px 16px rgba(21,63,53,.16);}
.leadership-info{display:flex;align-items:center;gap:12px;padding:12px 14px;margin:18px 0 0;border-top:1px solid var(--border);color:var(--text-muted);font-size:12px;}
.leadership-info img{width:42px;height:42px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);}
.leadership-info b{color:var(--ink);}
.profile-view-box{background:var(--card);border-radius:14px;border:1px solid var(--border);padding:18px;margin-bottom:16px;}
.center-report-summary{background:linear-gradient(135deg,#fffdf7,#e8f2e7);border:1px solid var(--border);border-radius:14px;padding:16px;margin-bottom:18px;}
.center-report-summary h4{margin:0 0 10px;color:var(--ink);font-size:16px;}
@media (max-width:760px){
.app-shell{padding:16px 14px 86px;}
.module-grid,.task-form{grid-template-columns:1fr;}
.topbar{align-items:flex-start;}
.who span{display:none;}
.panel{padding:16px;overflow-x:auto;}
.tabbar{overflow-x:auto; flex-wrap:nowrap;padding-bottom:3px;}
.tabbar button{white-space:nowrap;flex:0 0 auto;}
.bottom-nav{position:fixed;display:flex;left:10px;right:10px;bottom:10px;z-index:20;background:rgba(255,253,248,.96); border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 30px rgba(21,63,53,.18); padding:7px;gap:5px;}
.bottom-nav button{flex:1;border:0;background:none;color:var(--text-muted);font-family:inherit; font-size:11px;padding:7px 3px;border-radius:12px;}
.bottom-nav button.active{background:var(--ink);color:#fff;}
}
@media (max-width:460px) {
.leadership{grid-template-columns:1fr;}
.brand-text .name{font-size:14px;}
.brand-logo{width:65px;height:65px; flex-basis:65px;}
.hero-welcome{align-items:flex-start;}
.hero-brand-logo{width:50px;height:50px; flex-basis:50px;}
}
</style>
</head>

      <img class="login-logo" src="logo.jpeg" onerror="this.onerror=null;this.src='logo.png';" alt="निर्भय भारत लोगो">
      <h1>निर्भय भारत सामाजिक संस्था</h1>

      <div style="text-align:center;padding:20px;color:var(--text-muted);">क्लाऊड डेटा लोड होत आहे...</div>
    </div>
  </div>
</div>

<script>

function todayStr() { return new Date().toISOString().slice(0,10); }
function fmtTime(d) { return d.toLocaleTimeString('mr-IN', {hour:'2-digit', minute:'2-digit'}); }
function fmtDate(s) { return new Date(s+'T00:00:00').toLocaleDateString('mr-IN', {day:'numeric', month: 'short', year:'numeric'}); }

function hoursBetween(inISO, outISO) {
  if(!inISO||!outISO) return null;
  const ms = new Date(outISO) - new Date(inISO);
  return Math.max(0, ms/3600000);
}

function nextEmpId(){
  const emps = DB && DB.employees ? (Array.isArray(DB.employees) ? DB.employees : Object.values(DB.employees)) : [];
  const nums = emps.map(e=> parseInt((e.id||'').replace(/\D/g, ''))||0);
  const n = (nums.length? Math.max(...nums):0)+1;
  return 'NBSS' + String(n).padStart(3,'0');
}

function seedData(){

      {id: 'br_velha', name: 'वेल्हा केंद्र', address: 'वेल्हा तालुका', status: 'सक्रिय'},
      {id: 'br_pune', name: 'पुणे शहर केंद्र', address: 'पुणे शहर', status: 'सक्रिय'}
    ],
    employees: {},
    admins: [
      {username:'admin1', password:'admin123', name: 'अक्षय कामठे'},
      {username:'admin2', password:'admin123', name: 'ईश्वर कामठे'}
    ],
    attendance: {}, 
    work: {},

function requestNotificationPermission() {
  if ('Notification' in window && Notification.permission !== 'granted' && Notification.permission !== 'denied') {
    Notification.requestPermission();
  }
}

function showSystemNotification(title, bodyText) {
  if ('Notification' in window && Notification.permission === 'granted') {
    try {
      navigator.serviceWorker.ready.then(registration => {
        registration.showNotification(title, {
          body: bodyText,
          icon: './icons/icon-192.png',
          badge: './icons/icon-192.png',
          vibrate: [200, 100, 200]
        });
      }).catch(() => {
        new Notification(title, { body: bodyText, icon: './icons/icon-192.png' });
      });
    } catch (e) {
      new Notification(title, { body: bodyText, icon: './icons/icon-192.png' });
    }
  }
}

function playVoiceAlert(spokenText) {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); 
    osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.12); 
    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.45);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.5);
  } catch(e) {}

  if(navigator.vibrate) navigator.vibrate([200, 100, 300]);

  if('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(spokenText);
    utterance.lang = 'mr-IN';
    utterance.rate = 0.95;
    utterance.pitch = 1.05;
    setTimeout(() => {
      window.speechSynthesis.speak(utterance);
    }, 550);
  }
}

function checkMorningNotification() {
  const currentHour = new Date().getHours();
  const lastMorningDate = localStorage.getItem('nbss_last_morning_alert');

    showSystemNotification("🌅 शुभ सकाळ - निर्भय भारत संस्था", "कृपया आज कामावर आल्यावर आपली फोटो व GPS हजेरी वेळेत नोंदवा.");

function registerBiometric(userType, identifier) {
  const secretKey = btoa(identifier + "_" + Date.now());
  localStorage.setItem('nbss_native_thumb', JSON.stringify({
    type: userType,
    id: identifier,
    key: secretKey,
    device: navigator.userAgent

function loginWithBiometric() {
  const thumbData = localStorage.getItem('nbss_native_thumb') || localStorage.getItem('nbss_bio_auth');
  if(!thumbData) {
    alert("⚠️ या मोबाईलवर अद्याप कोणताही थंब लिंक केलेला नाही.\n\nकृपया प्रथम युझरनेम आणि पासवर्डने लॉगिन करा आणि आत जाऊन '👆 थंब जोडा' वर क्लिक करा.");
    return;
  }
  
  const { type, id } = JSON.parse(thumbData);
  
  // मोबाईल व्हायब्रेशन व चाईम
  if(navigator.vibrate) navigator.vibrate([150, 50, 150]);
  
  if(type === 'admin') {
    const adm = (DB.admins||[]).find(a => a.username === id);
    if(adm) {

  } else {

    if(emp && emp.status === 'सक्रिय') { 
      session = { role: 'employee', id: emp.id }; 
      render();

}

function compareFaceImages(capturedDataUrl, targetDataUrl) {
  return new Promise((resolve) => {
    const img1 = new Image();
    const img2 = new Image();
    let loaded = 0;
    const checkLoaded = () => {
      loaded++;
      if (loaded === 2) {
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 64; canvas.height = 64;
        ctx.drawImage(img1, 0, 0, 64, 64);
        const data1 = ctx.getImageData(0, 0, 64, 64).data;
        ctx.clearRect(0,0,64,64);
        ctx.drawImage(img2, 0, 0, 64, 64);
        const data2 = ctx.getImageData(0, 0, 64, 64).data;
        let diff = 0;
        for(let i=0; i<data1.length; i+=4) {
          diff += Math.abs(data1[i] - data2[i]) + Math.abs(data1[i+1] - data2[i+1]) + Math.abs(data1[i+2] - data2[i+2]);
        }
        const total = data1.length * 255;
        const similarity = 1 - (diff / total);
        resolve(similarity > 0.55);
      }
    };
    img1.onload = checkLoaded;
    img2.onload = checkLoaded;
    img1.src = capturedDataUrl;
    img2.src = targetDataUrl;
  });
}

function initFirebaseSync(){
  dbRef.on('value', (snapshot) => {
    const val = snapshot.val();
    if(val) {
      DB = val;
    } else {
      DB = seedData();
      saveDB();
    }
    
    if(!DB.admins) DB.admins = seedData().admins;
    if(!DB.branches) DB.branches = seedData().branches;
    if(!DB.employees) DB.employees = {};
    if(!DB.attendance) DB.attendance = {};
    if(!DB.work) DB.work = {};
    if(!DB.tasks) DB.tasks = {};
    if(!DB.leaves) DB.leaves = {};
    if(!DB.announcements) DB.announcements = seedData().announcements;

    const allEmps = getEmployeesList();
    const pendingEmps = allEmps.filter(e => e.status === 'प्रलंबित');
    const allTasks = getTasksList();

    if (lastKnownPendingEmpCount !== null && pendingEmps.length > lastKnownPendingEmpCount) {
      if (session && session.role === 'admin') {
        const latestPending = pendingEmps[pendingEmps.length - 1];
        showSystemNotification("👤 नवीन कर्मचारी नोंदणी", `${latestPending.name} यांनी नवीन नोंदणी केली आहे. मंजुरीसाठी तपासा.`);
        playVoiceAlert(`लक्ष द्या. ${latestPending.name} यांनी नवीन नोंदणी केली आहे. कृपया ॲडमिन पॅनलमध्ये मंजुरी द्या.`);
      }
    }
    lastKnownPendingEmpCount = pendingEmps.length;

    if (lastKnownTaskCount !== null && allTasks.length > lastKnownTaskCount) {
      if (session && session.role === 'employee') {
        const latestTask = allTasks[allTasks.length - 1];
        if (latestTask.employeeId === 'all' || latestTask.employeeId === session.id) {
          showSystemNotification("📋 प्रशासकाकडून नवीन काम", latestTask.title || "नवीन काम व ऑडिओ संदेश आला आहे.");
          playVoiceAlert("निर्भय भारत सामाजिक संस्था. प्रशासकाकडून नवीन काम व सूचना आली आहे.");
        }
      }
    }
    lastKnownTaskCount = allTasks.length;

    checkMorningNotification();
    render();
  });
}

function attachLoginEvents(){
  requestNotificationPermission();
  const te = document.getElementById('tab-emp'); if(te) te.onclick = ()=>{loginRole='employee';render();};
  const ta = document.getElementById('tab-adm'); if(ta) ta.onclick = ()=>{loginRole='admin'; render();};
  const bioBtn = document.getElementById('li-bio-btn'); if(bioBtn) bioBtn.onclick = loginWithBiometric;
  const faceBtn = document.getElementById('li-face-btn'); if(faceBtn) faceBtn.onclick = startFaceUnlock;

  const sub = document.getElementById('li-submit');
  if(sub) sub.onclick = ()=>{
    const u = document.getElementById('li-user')?.value.trim().toLowerCase();
    const p = document.getElementById('li-pass')?.value;
    const err = document.getElementById('li-err');
    if(!u || !p) { if(err) err.textContent='कृपया युझरनेम आणि पासवर्ड टाका.'; return; }

    if (loginRole==='employee') {
      const empList = getEmployeesList();
      const emp = empList.find(e=> (e.username && e.username.toLowerCase()===u) || (e.id && e.id.toLowerCase()===u));
      if(!emp || emp.password !== p){ if(err) err.textContent='वापरकर्ता नाव किंवा पासवर्ड चुकीचा आहे.'; return; }
      if(emp.status==='प्रलंबित') { if(err) err.textContent='तुमची नोंदणी अद्याप प्रशासकाकडून मंजूर झालेली नाही.'; return; }
      if(emp.status==='निष्क्रिय') { if(err) err.textContent='हे खाते प्रशासकाकडून निष्क्रिय केले आहे.'; return; }
      session = {role:'employee', id:emp.id};
    } else {
      const adm = (DB.admins||[]).find(a=>a.username.toLowerCase()===u && a.password===p);
      if(!adm){ if(err) err.textContent='प्रशासक नाव किंवा पासवर्ड चुकीचा आहे.'; return; }
      session = {role:'admin', username:adm.username, name:adm.name};
    }
    render();
  };

  const goReg = document.getElementById('go-register');
  if(goReg) goReg.onclick = ()=>{ showRegister=true; regPhoto=null; render(); };
  const back = document.getElementById('rg-back');
  if(back) back.onclick = ()=>{ showRegister=false; render(); };
  const takePhoto = document.getElementById('reg-take-photo');
  if (takePhoto) takePhoto.onclick = ()=>{ openCamera('register'); };

  const regSubmit = document.getElementById('rg-submit');
  if(regSubmit) regSubmit.onclick = ()=>{
    const name = document.getElementById('rg-name')?.value.trim();
    const mobile = document.getElementById('rg-mobile')?.value.trim();
    const dob = document.getElementById('rg-dob')?.value || null;
    const desig = document.getElementById('rg-desig')?.value.trim();
    const branchId = document.getElementById('rg-branch')?.value;
    const username = document.getElementById('rg-username')?.value.trim().toLowerCase();
    const pass = document.getElementById('rg-pass')?.value;
    const pass2 = document.getElementById('rg-pass2')?.value;
    const err = document.getElementById('rg-err');

    if(!name || !mobile || !desig || !username || !pass) { if(err) err.textContent='कृपया सर्व आवश्यक माहिती भरा.'; return; }
    if(!/^\d{10}$/.test(mobile)){ if(err) err.textContent='कृपया योग्य 10 अंकी मोबाईल क्रमांक टाका.'; return; }
    if (pass !== pass2){ if(err) err.textContent='दोन्ही पासवर्ड जुळत नाहीत.'; return; }
    
    const empList = getEmployeesList();
    if(empList.find(e=>e.username && e.username.toLowerCase()===username)) { if(err) err.textContent='हे वापरकर्ता नाव आधीच अस्तित्वात आहे.'; return; }
    if(!regPhoto) { if(err) err.textContent='कृपया कर्मचारी फोटो घ्या.'; return; }

    const newId = nextEmpId();
    const newEmp = {
      id: newId, name, mobile, dob, branchId, designation:desig,
      username, password:pass, status: 'प्रलंबित', photo:regPhoto,
      registeredAt: new Date().toISOString()
    };

    if(!DB.employees) DB.employees = {};
    DB.employees[newId] = newEmp;
    
    saveDB();
    regPhoto = null;
    showRegister = false;
    loginRole = 'employee';
    render();
    alert(`✅ नोंदणी यशस्वी झाली आहे! (तुमचा आयडी: ${newId})\n\nप्रशासकाने मंजूर केल्यावर तुम्ही लॉगिन करू शकाल.`);
  };
}

function requestLeave(){
  const from = window.prompt('रजा सुरू होण्याची तारीख (YYYY-MM-DD)', todayStr());
  if(!from) return;
  const to = window.prompt('रजा संपण्याची तारीख (YYYY-MM-DD)', from);
  if(!to) return;
  const reason = window.prompt('रजेचे कारण:');
  if(!reason) return;

  const emp = getEmp();
  const branch = emp && (DB.branches||[]).find(b=>b.id===emp.branchId);
  if(!DB.leaves) DB.leaves = {};
  const leaveId = 'lv_' + Date.now();
  DB.leaves[leaveId] = {
    id: leaveId, 
    employeeId: session.id, 
    applicantName: emp?.name||'कर्मचारी', 
    applicantCenter: branch?.name||'केंद्र',
    submittedAt: new Date().toISOString(), 
    leaveDate: `${from} ते ${to}`, 
    reason, 
    status: 'प्रलंबित'
  };
  saveDB();
  alert('रजेचा अर्ज प्रशासकाकडे सादर करण्यात आला आहे.');
  render();
}

function openCamera(purpose) {
  camPurpose = purpose; capturedPhoto=null; gpsCoords=null; gpsError=null;
  render();
  startCameraStream();
  if(purpose!=='register' && purpose!=='facelock') requestGPS();
}

function openWorkForm() { camPurpose='work'; render(); }

function startCameraStream(){
  if (!navigator.mediaDevices?.getUserMedia){
    const camFrame = document.querySelector('.cam-frame');
    if(camFrame) camFrame.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-muted);">कॅमेरा उपलब्ध नाही.</div>';
    return;
  }
  navigator.mediaDevices.getUserMedia({video: {facingMode:'user'}, audio:false}).then(stream=>{
    camStream = stream;
    const v = document.getElementById('cam-video');
    if(v){ v.srcObject = stream; }
  }).catch(()=>{
    const camFrame = document.querySelector('.cam-frame');
    if(camFrame) camFrame.innerHTML = '<div style="padding:20px;text-align:center;color:var(--danger);">कॅमेरा परवानगी आवश्यक आहे.</div>';
  });
}

function stopCameraStream() { if (camStream) { camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }

function requestGPS(){
  if(!navigator.geolocation) { gpsError='GPS उपलब्ध नाही.'; updateGpsBox(); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    gpsCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    updateGpsBox();
  }, err=>{
    gpsError = 'GPS स्थान मिळाले नाही; फोटोसह हजेरी नोंदवली जाईल.';
    updateGpsBox();
  }, {enableHighAccuracy:true, timeout:10000});
}

function updateGpsBox(){
  const box = document.getElementById('gps-box');
  if(!box) return;
  box.className = 'gps-box' + (gpsCoords?' ok':(gpsError?' err':''));
  box.textContent = gpsCoords ? `स्थान नोंदवले: ${gpsCoords.lat.toFixed(5)}, ${gpsCoords.lng.toFixed(5)}`: (gpsError || 'तुमचे सध्याचे GPS स्थान शोधत आहोत...');
  const confirmBtn = document.getElementById('cam-confirm');
  if (confirmBtn) confirmBtn.disabled = !gpsCoords && !gpsError;
}

  const capBtn = document.getElementById('cam-capture');
  if (capBtn) capBtn.onclick = ()=>{
    const v = document.getElementById('cam-video');
    const c = document.getElementById('cam-canvas');
    if(!v || !v.videoWidth || !c) return;
    c.width = 320; c.height = 240;
    const ctx = c.getContext('2d');
    ctx.drawImage(v,0,0,320,240);
    capturedPhoto = c.toDataURL('image/jpeg', 0.6);
    stopCameraStream();
    render();
  };

  const faceScanBtn = document.getElementById('cam-face-scan');
  if(faceScanBtn) faceScanBtn.onclick = async ()=>{
    const v = document.getElementById('cam-video');
    const c = document.getElementById('cam-canvas');
    const st = document.getElementById('face-status');
    if(!v || !v.videoWidth || !c) return;
    c.width = 320; c.height = 240;
    const ctx = c.getContext('2d');
    ctx.drawImage(v,0,0,320,240);
    const scannedPhoto = c.toDataURL('image/jpeg', 0.6);
    
    if(st) st.textContent = 'चेहरा पडताळत आहोत (AI Matching)...';

    const activeEmps = getEmployeesList().filter(e=>e.status==='सक्रिय' && e.photo);
    let matchedEmp = null;

    for(let emp of activeEmps) {
      const match = await compareFaceImages(scannedPhoto, emp.photo);
      if(match) {
        matchedEmp = emp;
        break;
      }
    }

    if(matchedEmp) {
      if(st) st.innerHTML = `<span style="color:var(--success);">✅ चेहरा ओळखला: ${matchedEmp.name}</span>`;
      setTimeout(()=>{
        closeModal();
        session = { role: 'employee', id: matchedEmp.id };
        render();
      }, 700);
    } else {
      if(st) st.innerHTML = '<span style="color:var(--danger);">❌ चेहरा जुळला नाही. कृपया चांगल्या प्रकाशात पुन्हा प्रयत्न करा किंवा थंब वापरा.</span>';
    }
  };

  const retakeBtn = document.getElementById('cam-retake');
  if (retakeBtn) retakeBtn.onclick = ()=>{ capturedPhoto=null; render(); startCameraStream(); };

  const confirmBtn = document.getElementById('cam-confirm');
  if(confirmBtn) confirmBtn.onclick = ()=>{
    if(camPurpose==='register'){
      regPhoto = capturedPhoto;
      camPurpose = null; capturedPhoto=null;
      showRegister = true;
      render();
      return;
    }
    const key = attKey(session.id, todayStr());
    if(!DB.attendance) DB.attendance = {};
    if(!DB.attendance[key]) DB.attendance[key] = {employeeId:session.id, date:todayStr()};
    const entry = {time:new Date().toISOString(), lat:gpsCoords?.lat?? null, lng:gpsCoords?.lng?? null, photo:capturedPhoto};
    
    if(camPurpose==='checkin') DB.attendance[key].checkIn = entry;
    else DB.attendance[key].checkOut = entry;
    
    saveDB();
    closeModal();
    if(camPurpose==='checkout' && !DB.work[key]) openWorkForm();
  };

  const wfSubmit = document.getElementById('wf-submit');
  if(wfSubmit) wfSubmit.onclick = ()=>{
    const reg = parseInt(document.getElementById('wf-reg')?.value)||0;
    const cl = parseInt(document.getElementById('wf-claims')?.value)||0;
    const rn = parseInt(document.getElementById('wf-renew')?.value)||0;
    const cd = parseInt(document.getElementById('wf-cards')?.value)||0;
    const other = document.getElementById('wf-other')?.value.trim()||'';
    const key = attKey(session.id, todayStr());
    if(!DB.work) DB.work = {};
    DB.work[key] = {employeeId:session.id, date:todayStr(), newRegistrations:reg, newClaims:cl, formRenewals:rn, cardsIssued:cd, otherWork:other};
    saveDB();
    closeModal();
    alert('आजच्या कामाचा अहवाल यशस्वीरित्या सादर केला!');
  };
}

function closeModal(){
  stopCameraStream();
  const wasRegister = camPurpose==='register';
  camPurpose=null; capturedPhoto=null; gpsCoords=null; gpsError=null;
  if (wasRegister && !session) { showRegister = true; }
  render();
}

function attachTaskEvents(){
  const recBtn = document.getElementById('task-record-btn');
  const stopBtn = document.getElementById('task-stop-btn');
  const timer = document.getElementById('task-timer');
  const removeAudioBtn = document.getElementById('task-audio-remove');
  const errEl = document.getElementById('task-error');

  if(recBtn) recBtn.onclick = async ()=>{
    if(!navigator.mediaDevices?.getUserMedia){
      if(errEl) errEl.textContent = 'या ब्राऊझरमध्ये व्हॉइस रेकॉर्डिंग सपोर्ट नाही.';
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      taskAudioChunks = [];
      taskRecorder = new MediaRecorder(stream);
      taskRecorder.ondataavailable = (e)=>{ if(e.data.size) taskAudioChunks.push(e.data); };
      taskRecorder.onstop = ()=>{
        clearInterval(taskRecordingTimer);
        taskRecordingSeconds = 0;
        stream.getTracks().forEach(track=>track.stop());
        const blob = new Blob(taskAudioChunks, {type: taskRecorder.mimeType || 'audio/webm'});
        const reader = new FileReader();
        reader.onloadend = ()=>{
          taskAudioData = reader.result;
          render();
        };
        reader.readAsDataURL(blob);
      };
      taskRecorder.start();
      recBtn.style.display = 'none';
      if(stopBtn) stopBtn.style.display = 'inline-block';
      if(timer){
        timer.textContent = '00:00';
        timer.style.display = 'inline-block';
        taskRecordingSeconds = 0;
        taskRecordingTimer = setInterval(()=>{
          taskRecordingSeconds++;
          const mins = String(Math.floor(taskRecordingSeconds/60)).padStart(2,'0');
          const secs = String(taskRecordingSeconds%60).padStart(2,'0');
          timer.textContent = `${mins}:${secs}`;
        }, 1000);
      }
    }catch(err){
      if(errEl) errEl.textContent = 'माईकची परवानगी नाकारली गेली आहे.';
    }
  };

  if(stopBtn) stopBtn.onclick = ()=>{
    if(taskRecorder && taskRecorder.state !== 'inactive') taskRecorder.stop();
  };

  if(removeAudioBtn) removeAudioBtn.onclick = ()=>{
    taskAudioData = null; render();
  };

  const saveTask = document.getElementById('save-task-btn');
  if(saveTask) saveTask.onclick = ()=>{
    const emp = document.getElementById('task-emp')?.value;
    const due = document.getElementById('task-due')?.value;
    const desc = document.getElementById('task-desc')?.value.trim();
    if(!desc && !taskAudioData) { 
      if(errEl) errEl.textContent = 'कृपया लेखी संदेश लिहा किंवा व्हॉइस मेसेज रेकॉर्ड करा.';
      return; 
    }
    if(!DB.tasks) DB.tasks = {};
    const taskId = 'task_' + Date.now();
    DB.tasks[taskId] = {
      id: taskId, 
      title: desc || 'प्रशासकाचा व्हॉइस मेसेज', 
      employeeId: emp, 
      due: due || null, 
      audioData: taskAudioData, 
      status:'प्रलंबित',
      createdAt: todayStr()
    };
    taskAudioData = null;
    saveDB(); 
    render();
    alert('✅ संदेश / काम कर्मचाऱ्यांच्या मोबाईलवर पाठवले गेले आहे!');
  };
}

function overviewTab(){
  const ds = todayStr();
  const allEmps = getEmployeesList();
  const active = allEmps.filter(e=>e.status==='सक्रिय');
  const presentToday = active.filter(e=>(DB.attendance||{})[attKey(e.id,ds)]?.checkIn);
  const absent = active.length - presentToday.length;

  return `
  <div class="metric-grid">
    <div class="metric"><div class="num">${active.length}</div><div class="lbl">एकूण सक्रिय कर्मचारी</div></div>
    <div class="metric"><div class="num">${presentToday.length}</div><div class="lbl">आज उपस्थित</div></div>
    <div class="metric warn"><div class="num">${absent}</div><div class="lbl">आज अनुपस्थित</div></div>
    <div class="metric"><div class="num">${getTasksList().length}</div><div class="lbl">एकूण कामे</div></div>
  </div>
  ${leadershipShowcase('dashboard-leadership')}
  <div class="panel">
    <h3>आज हजेरी नोंदवलेले कर्मचारी</h3>
    ${presentToday.length===0? '<div class="empty">आज अद्याप कोणीही हजेरी नोंदवलेली नाही.</div>':
    `<table><tr><th>कर्मचारी</th><th>चेक-इन वेळ</th><th>फोटो</th></tr>
    ${presentToday.map(e=>{
      const att = DB.attendance[attKey(e.id,ds)];
      return `<tr><td><b>${e.name}</b> (${e.id})</td><td>${fmtTime(new Date(att.checkIn.time))}</td><td>${att.checkIn.photo? `<img src="${att.checkIn.photo}" style="width:36px;height:36px;border-radius:6px;object-fit:cover;">`:'-'}</td></tr>`;
    }).join('')}</table>`}
  </div>`;
}

function employeesTab(){
  const list = getEmployeesList().filter(e=>e.status!=='प्रलंबित');
  return `
  <div class="panel">
    <div class="toolbar">
      <h3>👥 सर्व सक्रिय कर्मचारी व्यवस्थापन (${list.length})</h3>
    </div>
    ${list.length===0? '<div class="empty">अद्याप कोणतेही कर्मचारी सक्रिय नाहीत.</div>':
    `<table>
      <thead>
        <tr>
          <th>कर्मचारी तपशील</th>
          <th>पद</th>
          <th>मोबाईल</th>
          <th>स्थिती (Status)</th>
          <th style="text-align:center;">कृती (Actions)</th>
        </tr>
      </thead>
      <tbody>
      ${list.map(e=>`
        <tr>
          <td><b>${e.name}</b><br><small style="color:var(--text-muted);">${e.id} • ${getBranchName(e.branchId)}</small></td>
          <td>${e.designation}</td>
          <td>${e.mobile}</td>
          <td>
            <span class="status-tag ${e.status==='सक्रिय'?'present':'absent'}" style="cursor:pointer;" onclick="toggleEmpStatus('${e.id}')" title="क्लिक करून बदला">
              ${e.status==='सक्रिय'?'🟢 सक्रिय':'🔴 निष्क्रिय'}
            </span>
          </td>
          <td style="text-align:center;white-space:nowrap;">
            <button class="small-btn" onclick="openEmpDetails('${e.id}')">👁️ पहा</button>
            <button class="small-btn reject" onclick="deleteEmployee('${e.id}')" style="margin-left:4px;" title="कायमचे काढून टाका">🗑️ काढा</button>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>`}
  </div>`;
}

function getBranchName(branchId) {
  const b = (DB.branches||[]).find(x=>x.id===branchId);
  return b ? b.name : 'केंद्र';
}

function deleteEmployee(empId) {
  const empList = getEmployeesList();
  const emp = empList.find(e=>e.id===empId);
  const name = emp ? emp.name : empId;
  const ans = window.confirm(`⚠️ '${name}' या कर्मचाऱ्याला संस्थेतून कायमचे काढून टाकू इच्छिता का?`);
  if(!ans) return;

  if (DB.employees && DB.employees[empId]) {
    delete DB.employees[empId];
  } else if (Array.isArray(DB.employees)) {
    DB.employees = DB.employees.filter(e=>e.id!==empId);
  }

  saveDB();
  alert(`✅ '${name}' या कर्मचाऱ्याला काढून टाकले आहे!`);
  render();
}

function toggleEmpStatus(empId) {
  const emp = (DB.employees||{})[empId] || getEmployeesList().find(e=>e.id===empId);
  if(!emp) return;
  const newStatus = emp.status === 'सक्रिय' ? 'निष्क्रिय' : 'सक्रिय';
  const confirmMsg = newStatus === 'निष्क्रिय' 
    ? `'${emp.name}' यांना निष्क्रिय करायचे आहे का?` 
    : `'${emp.name}' यांना पुन्हा सक्रिय करायचे आहे का?`;
  
  if(window.confirm(confirmMsg)) {
    emp.status = newStatus;
    if (DB.employees && DB.employees[empId]) DB.employees[empId].status = newStatus;
    saveDB();
    render();
  }
}

function openEmpDetails(id){ empDetailId = id; render(); }

function employeeDetailModal(){
  const e = getEmployeesList().find(x=>x.id===empDetailId);
  if(!e) return '';
  const ds = todayStr();
  const att = (DB.attendance||{})[attKey(e.id,ds)];
  const wk = (DB.work||{})[attKey(e.id,ds)];
  return `
  <div class="modal-backdrop" id="modal-backdrop">
    <div class="modal" style="max-width:500px;">
      <button class="modal-close" onclick="empDetailId=null;render();">&times;</button>
      <div class="profile-header">
        ${e.photo? `<img src="${e.photo}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;">`:''}
        <div><h2>${e.name}</h2><p style="color:var(--text-muted);margin:0;">${e.id} • ${e.designation}</p><p style="color:var(--text-muted);margin:2px 0 0;">मोबाईल: ${e.mobile}</p></div>
      </div>
      <h3 style="font-size:14px;margin-top:16px;">आजची हजेरी</h3>
      ${att? `
        <div class="ledger-row"><span>येण्याची वेळ:</span><b>${att.checkIn?fmtTime(new Date(att.checkIn.time)):'-'}</b></div>
        <div class="ledger-row"><span>जाण्याची वेळ:</span><b>${att.checkOut?fmtTime(new Date(att.checkOut.time)):'-'}</b></div>
        <div class="photo-pair">
          <figure><img src="${att.checkIn?.photo||''}" onerror="this.style.display='none'"><figcaption>चेक-इन फोटो</figcaption></figure>
          <figure><img src="${att.checkOut?.photo||''}" onerror="this.style.display='none'"><figcaption>चेक-आउट फोटो</figcaption></figure>
        </div>`: '<div class="empty">आज हजेरी नाही.</div>'}
      <h3 style="font-size:14px;margin-top:16px;">आजचे काम</h3>
      ${wk? `<div class="ledger-row"><span>नोंदणी / क्लेम / नूतनीकरण / कार्ड:</span><b>${wk.newRegistrations}/${wk.newClaims}/${wk.formRenewals}/${wk.cardsIssued}</b></div><p style="font-size:13px;">${wk.otherWork||''}</p>`: '<div class="empty">काम सादर केलेले नाही.</div>'}
      
      <div style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;text-align:right;">
        <button class="small-btn reject" onclick="deleteEmployee('${e.id}');empDetailId=null;render();">🗑️ या कर्मचाऱ्याला कायमचे काढा</button>
      </div>
    </div>
  </div>`;
}

function pendingTab(){
  const pending = getEmployeesList().filter(e=>e.status==='प्रलंबित');
  return `
  <div class="panel">
    <h3>⏳ नवीन कर्मचारी नोंदणी अर्ज (${pending.length})</h3>
    ${pending.length===0? '<div class="empty">सध्या कोणतीही नवीन नोंदणी प्रलंबित नाही. सर्व अर्ज मंजूर आहेत.</div>':
    pending.map(e=>`
      <div class="ledger-entry" style="border-right-color:var(--warn);margin-bottom:12px;">
        <div style="display:flex;gap:12px;align-items:center;">
          ${e.photo? `<img src="${e.photo}" style="width:55px;height:55px;border-radius:8px;object-fit:cover;border:1px solid var(--border);">`:''}
          <div style="flex:1;">
            <div class="ledger-date">${e.name} (${e.id})</div>
            <div class="ledger-row"><span>मोबाईल:</span><b>${e.mobile}</b></div>
            <div class="ledger-row"><span>पद:</span><b>${e.designation}</b></div>
            <div class="ledger-row"><span>केंद्र:</span><b>${getBranchName(e.branchId)}</b></div>
            <div class="ledger-row"><span>युझरनेम:</span><b>${e.username}</b></div>
          </div>
        </div>
        <div style="display:flex;gap:8px;margin-top:12px;">
          <button class="small-btn approve" onclick="approveEmp('${e.id}')" style="flex:1;padding:9px;">✅ मंजूर करा (Approve)</button>
          <button class="small-btn reject" onclick="rejectEmp('${e.id}')" style="flex:1;padding:9px;">❌ नकार द्या (Reject)</button>
        </div>
      </div>`).join('')}
  </div>`;
}

function approveEmp(id){
  const emp = (DB.employees||{})[id] || getEmployeesList().find(x=>x.id===id);
  if(emp) { 
    emp.status = 'सक्रिय'; 
    if(DB.employees && DB.employees[id]) DB.employees[id].status = 'सक्रिय';
    saveDB(); 
    render(); 
    alert(`✅ ${emp.name} यांची नोंदणी मंजूर केली आहे. आता ते लॉगिन करू शकतात.`);
  }
}

function rejectEmp(id){
  if(confirm("हा नोंदणी अर्ज नाकारून काढून टाकायचा का?")) {
    if (DB.employees && DB.employees[id]) {
      delete DB.employees[id];
    } else if (Array.isArray(DB.employees)) {
      DB.employees = DB.employees.filter(x=>x.id!==id);
    }
    saveDB(); 
    render();
  }
}

function leaveRequestsTab(){
  const allLeaves = getLeavesList();
  return `
  <div class="panel">
    <h3>रजा विनंती अर्ज (${allLeaves.length})</h3>
    ${allLeaves.length===0? '<div class="empty">सध्या कोणताही अर्ज नाही.</div>':
    allLeaves.map(l=>`
      <div class="ledger-entry" style="margin-bottom:10px;">
        <div class="ledger-date">${l.applicantName} (${l.applicantCenter})</div>
        <div class="ledger-row"><span>कालावधी:</span><b>${l.leaveDate}</b></div>
        <div class="ledger-row"><span>कारण:</span><b>${l.reason}</b></div>
        <div class="ledger-row"><span>स्थिती:</span><b>${l.status}</b></div>
        ${l.status==='प्रलंबित'? `
        <div style="display:flex;gap:8px;margin-top:10px;">
          <button class="small-btn approve" onclick="updateLeave('${l.id}','मंजूर')">मंजूर करा</button>
          <button class="small-btn reject" onclick="updateLeave('${l.id}','नाकार')">नाकार द्या</button>
        </div>`:''}

function updateLeave(id, status){
  if(DB.leaves && DB.leaves[id]) {
    DB.leaves[id].status = status;
    saveDB(); render();
  }
}

function adminSettingsTab(){
  const isBioLinked = !!(localStorage.getItem('nbss_native_thumb') || localStorage.getItem('nbss_bio_auth'));
  return `
  <div class="panel" style="max-width:500px;">
    <h3>🔐 प्रशासक पासवर्ड व थंब सेटिंग्ज</h3>
    <p style="font-size:13px;color:var(--text-muted);">सध्याचे लॉगिन: <b>${session.name}</b> (${session.username})</p>
    
    <div style="margin:16px 0;padding:14px;background:var(--paper);border-radius:12px;">
      <label style="font-weight:700;color:var(--ink);display:block;margin-bottom:6px;">👆 थंब लॉगिन (Fingerprint):</label>
      <small style="color:var(--text-muted);display:block;margin-bottom:10px;">
        ${isBioLinked ? 'या फोनवर ॲडमिन थंब लिंक केलेला आहे.' : 'या फोनवर कोणताही थंब लिंक केलेला नाही.'}
      </small>
      <div style="display:flex;gap:8px;">
        <button class="btn btn-bio" id="adm-enable-bio" style="margin:0;flex:1;">${isBioLinked ? '🔄 थंब अपडेट करा' : '👆 ॲडमिन थंब जोडा'}</button>
        ${isBioLinked ? `<button class="btn btn-secondary" id="adm-remove-bio" style="margin:0;flex:1;border-color:var(--danger);color:var(--danger);">🗑️ थंब काढा</button>` : ''}
      </div>
    </div>

    <h3 style="font-size:14px;margin-top:20px;">पासवर्ड बदला:</h3>
    <div class="field"><label>सध्याचा पासवर्ड</label><input type="password" id="adm-curr-pass" placeholder="सध्याचा पासवर्ड टाका"></div>
    <div class="field"><label>नवीन पासवर्ड</label><input type="password" id="adm-new-pass" placeholder="नवीन पासवर्ड तयार करा"></div>
    <div class="field"><label>नवीन पासवर्ड पुन्हा टाका</label><input type="password" id="adm-new-pass2" placeholder="पुन्हा पासवर्ड टाका"></div>
    <div class="login-error" id="adm-pass-err"></div>
    <button class="btn btn-primary" id="adm-change-pass-btn">पासवर्ड अपडेट करा</button>
  </div>`;
}

function attachAdminEvents(){
  attachLogoutEvent();
  document.querySelectorAll('.tabbar button').forEach(btn=>{
    btn.onclick = ()=>{ adminTab = btn.dataset.tab; render(); };
  });

  const branchSel = document.getElementById('report-branch-select');
  if(branchSel) branchSel.onchange = (e)=>{ reportBranchFilter = e.target.value; render(); };

  const timeSel = document.getElementById('report-timeframe-select');
  if(timeSel) timeSel.onchange = (e)=>{ reportTimeframe = e.target.value; render(); };

  const exportBtn = document.getElementById('export-excel-btn');
  if(exportBtn) exportBtn.onclick = exportCenterReportToCSV;

  attachTaskEvents();

  const bioAdmBtn = document.getElementById('adm-enable-bio');
  if(bioAdmBtn) bioAdmBtn.onclick = ()=> registerBiometric('admin', session.username);

  const removeAdmBio = document.getElementById('adm-remove-bio');
  if(removeAdmBio) removeAdmBio.onclick = removeBiometric;

  const passBtn = document.getElementById('adm-change-pass-btn');
  if(passBtn) passBtn.onclick = ()=>{
    const curr = document.getElementById('adm-curr-pass')?.value;
    const newP = document.getElementById('adm-new-pass')?.value;
    const newP2 = document.getElementById('adm-new-pass2')?.value;
    const err = document.getElementById('adm-pass-err');
    
    const adminObj = (DB.admins||[]).find(a=>a.username===session.username);
    if(!adminObj || adminObj.password !== curr){
      if(err) err.textContent = 'सध्याचा पासवर्ड चुकीचा आहे.'; return;
    }
    if(!newP || newP.length < 4){
      if(err) err.textContent = 'नवीन पासवर्ड किमान ४ अक्षरांचा असावा.'; return;
    }
    if(newP !== newP2){
      if(err) err.textContent = 'नवीन पासवर्ड जुळत नाहीत.'; return;
    }
    adminObj.password = newP;
    saveDB();
    alert('✅ पासवर्ड यशस्वीरित्या बदलला आहे!');
    render();
  };
}

const origRender = render;
render = function() { origRender(); attachModalEvents(); };

initFirebaseSync();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(err=>{
      console.warn('Service worker registration failed:', err);
    });
  });
}
</script>
