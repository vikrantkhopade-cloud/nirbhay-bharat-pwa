<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>निर्भय भारत सामाजिक संस्था — हजेरी</title>

<!-- PWA: manifest + icons + theme -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#1B3B36">
<meta name="background-color" content="#F2EFE6">
<meta name="description" content="कर्मचारी हजेरी आणि दैनंदिन कामाचा अहवाल">
<link rel="icon" type="image/jpeg" href="/logo.jpeg">
<link rel="apple-touch-icon" href="/logo.jpeg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="निर्भय भारत">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@500;600;700&family=Poppins:wght@600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B3B36;
    --ink-light:#2E5C53;
    --paper:#F2EFE6;
    --card:#FFFFFF;
    --accent:#D98E2B;
    --accent-dark:#96601B;
    --success:#3F7A46;
    --success-bg:#E4F0E2;
    --danger:#B23A2E;
    --danger-bg:#F8E4E1;
    --warn:#96601B;
    --warn-bg:#F5E9D3;
    --text:#20241F;
    --text-muted:#5C6459;
    --border:#DCD6C4;
    --radius:14px;
    --shadow:0 1px 2px rgba(27,59,54,0.06), 0 4px 14px rgba(27,59,54,0.06);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--text);
    font-family:'Noto Sans Devanagari','Inter',sans-serif;
    min-height:100vh;
    min-height:100dvh;
    font-size:15px;
    overscroll-behavior-y:none;
    padding-bottom:env(safe-area-inset-bottom);
  }
  /* touch-friendly tap targets */
  button, .field input, .field select, .field textarea, .search-row input, .search-row select{
    min-height:44px;
  }
  button{touch-action:manipulation;}
  h1,h2,h3,.display{font-family:'Noto Sans Devanagari',sans-serif;font-weight:700;}
  button{font-family:'Noto Sans Devanagari','Inter',sans-serif;cursor:pointer;}
  .app-shell{max-width:1180px;margin:0 auto;padding:20px 16px 60px;}

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 0 22px;border-bottom:1px solid var(--border);margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .brand{display:flex;align-items:center;gap:10px;}
  .brand-mark{width:38px;height:38px;border-radius:10px;background:var(--ink);color:#F2EFE6;display:flex;align-items:center;justify-content:center;font-family:'Poppins';font-weight:700;font-size:14px;letter-spacing:0.5px;}
  .brand-text .name{font-weight:700;font-size:15px;line-height:1.3;}
  .brand-text .sub{font-size:12px;color:var(--text-muted);}
  .who{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--text-muted);}
  .logout-btn{background:none;border:1px solid var(--border);border-radius:8px;padding:8px 15px;font-size:14px;color:var(--text);}
  .logout-btn:hover{background:var(--card);}

  .login-wrap{display:flex;justify-content:center;padding-top:5vh;}
  .login-card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:34px 30px;width:100%;max-width:400px;}
  .login-card .brand-mark{margin:0 auto 14px;width:48px;height:48px;font-size:17px;}
  .login-card h1{font-size:19px;text-align:center;margin:0 0 4px;}
  .login-card p.tag{text-align:center;color:var(--text-muted);font-size:13px;margin:0 0 24px;}
  .role-toggle{display:flex;background:var(--paper);border-radius:10px;padding:4px;margin-bottom:20px;}
  .role-toggle button{flex:1;border:none;background:none;padding:10px 0;border-radius:8px;font-size:14px;font-weight:600;color:var(--text-muted);}
  .role-toggle button.active{background:var(--ink);color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:13px;color:var(--text-muted);margin-bottom:5px;font-weight:500;}
  .field input,.field select,.field textarea{width:100%;border:1px solid var(--border);border-radius:9px;padding:12px 12px;font-size:15px;background:#fff;font-family:'Noto Sans Devanagari','Inter';color:var(--text);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent);}
  .btn{border:none;border-radius:10px;padding:14px 18px;font-size:15px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;}
  .btn-primary{background:var(--ink);color:#fff;width:100%;}
  .btn-primary:hover{background:var(--ink-light);}
  .btn-primary:disabled{opacity:0.5;cursor:not-allowed;}
  .btn-secondary{background:none;border:1px solid var(--border);width:100%;color:var(--text);margin-top:8px;}
  .login-error{color:var(--danger);font-size:13px;margin:-4px 0 14px;min-height:0;}
  .login-ok{color:var(--success);font-size:13px;margin:-4px 0 14px;}
  .demo-hint{margin-top:18px;font-size:12px;color:var(--text-muted);background:var(--paper);border-radius:9px;padding:10px 12px;line-height:1.7;}
  .link-btn{background:none;border:none;color:var(--accent-dark);font-size:13.5px;font-weight:600;width:100%;text-align:center;margin-top:14px;}

  .phone-wrap{display:flex;justify-content:center;}
  .phone{width:100%;max-width:430px;}
  .status-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 20px;margin-bottom:16px;}
  .greet{font-size:13px;color:var(--text-muted);margin:0 0 2px;}
  .greet-name{font-size:20px;margin:0 0 2px;}
  .greet-center{font-size:13px;color:var(--accent-dark);font-weight:600;margin:0 0 16px;}
  .status-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--paper);font-size:14.5px;}
  .status-row:first-of-type{border-top:none;}
  .pill{font-size:12.5px;font-weight:700;padding:4px 11px;border-radius:20px;}
  .pill-done{background:var(--success-bg);color:var(--success);}
  .pill-pending{background:var(--danger-bg);color:var(--danger);}
  .pill-wait{background:var(--warn-bg);color:var(--warn);}

  .action-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .action-btn{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px 10px;text-align:center;font-weight:700;font-size:14px;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:8px;line-height:1.3;}
  .action-btn:hover:not(:disabled){border-color:var(--ink);}
  .action-btn:disabled{opacity:0.4;cursor:not-allowed;}
  .action-btn .ic{width:32px;height:32px;border-radius:50%;background:var(--paper);display:flex;align-items:center;justify-content:center;font-size:16px;}
  .action-btn.full{grid-column:1 / -1;flex-direction:row;justify-content:center;padding:15px;}
  .action-btn.accent{background:var(--ink);color:#fff;border-color:var(--ink);}
  .action-btn.accent .ic{background:rgba(255,255,255,0.15);}

  .list-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:6px 0;margin-bottom:16px;overflow:hidden;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--paper);font-size:14.5px;font-weight:500;}
  .list-item:last-child{border-bottom:none;}
  .list-item button{background:none;border:none;color:var(--accent-dark);font-size:14px;font-weight:700;}

  .ledger-entry{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;margin-bottom:10px;border-right:3px solid var(--accent);}
  .ledger-date{font-weight:700;font-size:14px;margin-bottom:6px;}
  .ledger-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);padding:3px 0;gap:10px;}
  .ledger-row b{color:var(--text);font-weight:600;text-align:left;}

  .modal-backdrop{position:fixed;inset:0;background:rgba(20,26,20,0.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal{background:#fff;border-radius:18px;max-width:440px;width:100%;max-height:90vh;overflow-y:auto;padding:22px;}
  .modal h2{font-size:17px;margin:0 0 14px;}
  .modal-close{float:left;background:none;border:none;font-size:20px;color:var(--text-muted);}
  video, canvas{width:100%;border-radius:12px;background:#000;}
  .cam-frame{position:relative;margin-bottom:14px;}
  .gps-box{background:var(--paper);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:14px;color:var(--text-muted);font-weight:500;}
  .gps-box.ok{color:var(--success);}
  .gps-box.err{color:var(--danger);}

  .tabbar{display:flex;gap:6px;margin-bottom:22px;flex-wrap:wrap;}
  .tabbar button{background:var(--card);border:1px solid var(--border);border-radius:9px;padding:10px 16px;font-size:13.5px;font-weight:600;color:var(--text-muted);}
  .tabbar button.active{background:var(--ink);color:#fff;border-color:var(--ink);}
  .tabbar button .badge-count{background:var(--danger);color:#fff;border-radius:10px;padding:1px 7px;font-size:11px;margin-right:6px;}
  .metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px;}
  .metric{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 18px;}
  .metric .num{font-family:'Poppins';font-size:26px;font-weight:600;color:var(--ink);}
  .metric .lbl{font-size:12.5px;color:var(--text-muted);margin-top:2px;font-weight:500;}
  .metric.warn .num{color:var(--danger);}

  .panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
  .panel h3{font-size:15px;margin:0 0 14px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:right;color:var(--text-muted);font-weight:600;font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{text-align:right;padding:11px 10px;border-bottom:1px solid var(--paper);}
  tr:last-child td{border-bottom:none;}
  .bar-wrap{display:flex;align-items:center;gap:8px;}
  .bar-track{flex:1;height:7px;background:var(--paper);border-radius:4px;overflow:hidden;}
  .bar-fill{height:100%;background:var(--success);border-radius:4px;}
  .search-row{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .search-row input,.search-row select{border:1px solid var(--border);border-radius:8px;padding:10px 11px;font-size:14px;background:#fff;font-family:'Noto Sans Devanagari','Inter';}
  .search-row input{flex:1;min-width:180px;}
  .emp-row{cursor:pointer;}
  .emp-row:hover{background:var(--paper);}
  .status-tag{font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:14px;}
  .status-tag.present{background:var(--success-bg);color:var(--success);}
  .status-tag.absent{background:var(--danger-bg);color:var(--danger);}
  .status-tag.pending{background:var(--warn-bg);color:var(--warn);}
  .small-btn{background:none;border:1px solid var(--border);border-radius:7px;padding:6px 12px;font-size:13px;color:var(--text);font-weight:600;}
  .small-btn:hover{background:var(--paper);}
  .small-btn.approve{border-color:var(--success);color:var(--success);}
  .small-btn.reject{border-color:var(--danger);color:var(--danger);}
  .empty{color:var(--text-muted);font-size:14px;padding:24px 4px;text-align:center;}
  .profile-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px;gap:12px;}
  .photo-pair{display:flex;gap:10px;margin:10px 0;}
  .photo-pair figure{margin:0;flex:1;}
  .photo-pair img{width:100%;border-radius:10px;background:var(--paper);aspect-ratio:4/3;object-fit:cover;}
  .photo-pair figcaption{font-size:12px;color:var(--text-muted);margin-top:4px;text-align:center;font-weight:500;}
  .reg-photo-btn{display:flex;align-items:center;gap:12px;background:var(--paper);border-radius:10px;padding:10px;margin-bottom:14px;}
  .reg-photo-btn img{width:56px;height:56px;border-radius:8px;object-fit:cover;}
  .reg-photo-btn .ph-placeholder{width:56px;height:56px;border-radius:8px;background:var(--border);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--text-muted);text-align:center;}

  @media (max-width:640px){
    .topbar{flex-wrap:wrap;gap:10px;}
    .metric-grid{grid-template-columns:repeat(2,1fr);}
    table{font-size:12.5px;}
  }
  :root{--ink:#153f35;--ink-light:#286b58;--paper:#f7f4ec;--card:#fffdf8;--accent:#e1a329;--accent-dark:#9b6810;--success:#317a52;--success-bg:#e4f3e8;--danger:#b6483d;--danger-bg:#fbe8e4;--border:#e4ddcc;--radius:16px;--shadow:0 10px 30px rgba(21,63,53,.08);}
  body{background:radial-gradient(circle at 10% 0%,#fffdf7 0,transparent 35%),var(--paper);}
  .app-shell{max-width:1240px;padding:24px 18px 72px;}
  .topbar{padding:10px 0 20px;margin-bottom:22px;border-bottom:0;}
  .brand-mark{background:linear-gradient(145deg,var(--ink),#286b58);box-shadow:0 8px 16px rgba(21,63,53,.18);}
  .login-wrap{min-height:100dvh;align-items:center;padding:28px 18px;background:linear-gradient(135deg,#f8f5ed 0%,#e7f0e5 100%);}
  .login-card{border:1px solid rgba(21,63,53,.08);box-shadow:0 24px 70px rgba(21,63,53,.14);padding:38px 30px;}
  .login-card:before{content:'समाजासाठी • सेवेसाठी • विश्वासासाठी';display:block;text-align:center;color:var(--accent-dark);font-size:11px;letter-spacing:.3px;margin-bottom:16px;}
  .btn-primary{background:linear-gradient(135deg,var(--ink),var(--ink-light));box-shadow:0 8px 16px rgba(21,63,53,.16);}
  .status-card,.panel,.metric,.list-card,.ledger-entry{border:1px solid rgba(21,63,53,.07);}
  .status-card{background:linear-gradient(145deg,#fffdf8,#f1f7ef);}
  .metric{position:relative;overflow:hidden;}
  .metric:after{content:'';position:absolute;right:-20px;top:-25px;width:70px;height:70px;border:12px solid rgba(225,163,41,.16);border-radius:50%;}
  .metric .num{font-size:28px;}
  .panel h3{color:var(--ink);}
  .insight-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:18px;margin-bottom:20px;}
  .chart-bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding:14px 4px 0;border-bottom:1px solid var(--border);}
  .chart-bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:11px;color:var(--text-muted);}
  .chart-bar i{display:block;width:100%;max-width:34px;min-height:8px;background:linear-gradient(180deg,var(--accent),#f0c96c);border-radius:8px 8px 2px 2px;}
  .rank-list{display:grid;gap:8px;}
  .rank-item{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:9px;font-size:13px;padding:8px 0;border-bottom:1px solid var(--paper);}
  .rank-item:last-child{border-bottom:0;}
  .rank-no{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--success-bg);color:var(--success);font-weight:700;}
  .progress{height:8px;background:var(--paper);border-radius:9px;overflow:hidden;margin-top:5px;}
  .progress i{display:block;height:100%;background:var(--success);border-radius:9px;}
  .module-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px;}
  .module-card{padding:16px;border:1px solid var(--border);border-radius:14px;background:var(--card);}
  .module-card strong{display:block;color:var(--ink);font-size:15px;margin-bottom:5px;}
  .module-card p{font-size:12.5px;color:var(--text-muted);margin:0 0 13px;line-height:1.6;}
  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap;}
  .toolbar h3{margin:0;}
  .icon-btn{width:42px;height:42px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--ink);font-size:18px;}
  .notice{padding:12px 14px;border-right:3px solid var(--accent);background:#fff9e9;border-radius:10px;font-size:13px;margin-bottom:10px;}
  .notice small{display:block;color:var(--text-muted);margin-top:4px;}
  .task-form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;}
  .task-form .field{margin:0;}.task-form .field.full{grid-column:1 / -1;}
  .task-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}.task-actions .small-btn{min-height:42px;}
  .task-audio{width:100%;margin-top:9px;max-height:34px;}.priority-high{color:var(--danger);}.priority-medium{color:var(--warn);}.priority-low{color:var(--success);}
  .attendance-row{cursor:pointer;}.attendance-row:hover{background:var(--paper);}.attendance-badge{display:inline-block;font-size:12px;font-weight:700;padding:4px 10px;border-radius:14px;}.attendance-good{background:var(--success-bg);color:var(--success);}.attendance-mid{background:var(--warn-bg);color:var(--warn);}.attendance-low{background:var(--danger-bg);color:var(--danger);}.attendance-photo{width:42px;height:42px;object-fit:cover;border-radius:9px;border:1px solid var(--border);}
  .bottom-nav{display:none;}
  @media(max-width:760px){
    .app-shell{padding:16px 14px 86px;}
    .insight-grid,.module-grid,.task-form{grid-template-columns:1fr;}
    .topbar{align-items:flex-start;}
    .who span{display:none;}
    .panel{padding:16px;overflow-x:auto;}
    .tabbar{overflow-x:auto;flex-wrap:nowrap;padding-bottom:3px;}
    .tabbar button{white-space:nowrap;flex:0 0 auto;}
    .bottom-nav{position:fixed;display:flex;left:10px;right:10px;bottom:10px;z-index:20;background:rgba(255,253,248,.96);border:1px solid var(--border);border-radius:18px;box-shadow:0 12px 30px rgba(21,63,53,.18);padding:7px;gap:5px;}
    .bottom-nav button{flex:1;border:0;background:none;color:var(--text-muted);font-family:inherit;font-size:11px;padding:7px 3px;border-radius:12px;}
    .bottom-nav button.active{background:var(--ink);color:#fff;}
  }
  body.dark{--paper:#14251f;--card:#1d332b;--text:#edf4e8;--text-muted:#b2c2b3;--border:#355247;--success-bg:#234b37;--danger-bg:#532b29;--warn-bg:#544321;background:#102019;}
  body.dark .field input,body.dark .field select,body.dark .field textarea,body.dark .search-row input,body.dark .search-row select{background:#162a23;color:var(--text);}
  body.dark .login-wrap{background:linear-gradient(135deg,#14251f,#244438);}
  body.dark .bottom-nav{background:rgba(29,51,43,.96);}
  .brand-logo,.login-logo{object-fit:cover;background:#fff;border:2px solid rgba(217,142,43,.55);box-shadow:0 8px 22px rgba(21,63,53,.2);}
  .brand-logo{width:75px;height:75px;border-radius:50%;flex:0 0 75px;border-color:var(--ink);box-shadow:0 0 0 4px rgba(225,163,41,.12),0 10px 24px rgba(21,63,53,.24);}
  .login-logo{width:100px;height:100px;border-radius:50%;display:block;margin:0 auto 14px;box-shadow:0 0 0 5px rgba(225,163,41,.14),0 12px 28px rgba(21,63,53,.22);}
  .brand-mark{display:none;}.brand-text .name{font-size:16px;color:var(--ink);}.brand-text .sub{color:var(--accent-dark);font-weight:700;}
  .leadership{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:18px 0 2px;}
  .leader-card{display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px;padding:12px;border:1px solid rgba(21,63,53,.11);border-radius:14px;background:linear-gradient(145deg,rgba(255,255,255,.86),rgba(244,240,226,.75));box-shadow:0 8px 20px rgba(21,63,53,.06);}
  .leader-card img{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--accent);outline:3px solid rgba(21,63,53,.72);box-shadow:0 10px 24px rgba(21,63,53,.2);}.leader-card b{display:block;color:var(--ink);font-size:14px;}.leader-card small{display:block;color:var(--text-muted);font-size:11.5px;line-height:1.5;}.leader-card em{display:block;color:var(--accent-dark);font-size:11px;font-style:normal;font-weight:700;margin-top:3px;}
  .leadership.dashboard-leadership{max-width:680px;margin:0 0 20px;}.leadership.dashboard-leadership .leader-card{padding:14px;}
  .login-card{backdrop-filter:blur(14px);background:rgba(255,253,248,.91);}.notice{background:linear-gradient(135deg,#fffaf0,#fff4dc);box-shadow:0 4px 12px rgba(21,63,53,.04);}
  body.dark .leader-card{background:rgba(29,51,43,.8);}.task-timer{font-family:'Poppins';font-size:13px;color:var(--danger);font-weight:700;}
  body.dark .notice{background:rgba(84,67,33,.38);}

<script>
/* ---------- STORAGE SHIM ----------
   मूळ prototype मध्ये Claude Artifacts चा window.storage API वापरला होता,
   जो फक्त claude.ai वर काम करतो. या production PWA मध्ये तोच API-shape
   ठेवून आत मात्र browser च्या localStorage शी जोडले आहे, त्यामुळे
   ॲपचा उरलेला कोड जसाच्या तसा (अनावश्यक बदलांशिवाय) राहतो.
   टीप: localStorage फक्त त्याच डिव्हाइस/ब्राउझरवर डेटा साठवतो — अनेक
   कर्मचाऱ्यांचा डेटा एकत्र (केंद्रीय पद्धतीने) साठवायचा असल्यास हे शेवटी
   एका backend/database ने बदलावे लागेल (README.md मध्ये सूचना दिली आहे). */
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem(key);
      if(v===null){ const e=new Error('key not found'); throw e; }
      return {key, value:v, shared:false};
    },
    async set(key, value){
      localStorage.setItem(key, value);
      return {key, value, shared:false};
    },
    async delete(key){
      const existed = localStorage.getItem(key)!==null;
      localStorage.removeItem(key);
      return {key, deleted:existed, shared:false};
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k=> !prefix || k.startsWith(prefix));
      return {keys, prefix, shared:false};
    }
  };
}

const STORAGE_KEY = 'nbss_data_v2_mr';
// Display text only. Keep persistent keys and application data independent of UI wording.
const ORGANIZATION_NAME = 'निर्भय भारत सामाजिक संस्था';
let DB = null;

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtTime(d){ return d.toLocaleTimeString('mr-IN', {hour:'2-digit',minute:'2-digit'}); }
function fmtDate(s){ return new Date(s+'T00:00:00').toLocaleDateString('mr-IN', {day:'numeric',month:'short',year:'numeric'}); }
function fmtSubmittedAt(value){
  if(!value) return 'वेळ उपलब्ध नाही';
  const date = new Date(value);
  if(Number.isNaN(date.getTime())) return 'वेळ उपलब्ध नाही';
  return `${date.toLocaleDateString('mr-IN',{day:'2-digit',month:'2-digit',year:'numeric'})} | ${date.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',hour12:true})}`;
}
function hoursBetween(inISO,outISO){
  if(!inISO||!outISO) return null;
  const ms = new Date(outISO) - new Date(inISO);
  return Math.max(0, ms/3600000);
}
function localDateFromString(dateString){
  const [year,month,day] = dateString.split('-').map(Number);
  return new Date(year,month-1,day);
}
function monthRange(monthValue){
  const [year,month] = monthValue.split('-').map(Number);
  const lastDay = new Date(year,month,0).getDate();
  return {year, month, lastDay};
}
function monthLabel(monthValue){ return localDateFromString(monthValue+'-01').toLocaleDateString('mr-IN',{month:'long',year:'numeric'}); }
function dateInRange(dateValue, from, to){ return dateValue >= from && dateValue <= to; }
function nextEmpId(){
  const nums = DB.employees.map(e=> parseInt((e.id||'').replace(/\D/g,''))||0);
  const n = (nums.length?Math.max(...nums):0)+1;

}

function normalizeDB(){
  const fallback = seedData();
  if(!DB || typeof DB !== 'object' || Array.isArray(DB)) DB = fallback;
  DB.branches = Array.isArray(DB.branches) ? DB.branches : fallback.branches;
  DB.employees = Array.isArray(DB.employees) ? DB.employees : fallback.employees;
  DB.admins = Array.isArray(DB.admins) ? DB.admins : fallback.admins;
  DB.admins = DB.admins.map(admin=>admin.username==='admin1' && admin.name==='\u0938\u0941\u0930\u0947\u0936 \u091c\u094b\u0936\u0940' ? {...admin,name:'अक्षय कामठे'} : admin);
  DB.attendance = DB.attendance && typeof DB.attendance === 'object' && !Array.isArray(DB.attendance) ? DB.attendance : {};
  DB.work = DB.work && typeof DB.work === 'object' && !Array.isArray(DB.work) ? DB.work : {};
  DB.tasks = Array.isArray(DB.tasks) ? DB.tasks.filter(task=>!task.due || task.due>=todayStr()) : [];
  DB.leaves = Array.isArray(DB.leaves) ? DB.leaves : [];
  DB.leaves = DB.leaves.map(leave=>{
    const employee = DB.employees.find(e=>e.id===leave.employeeId);
    const branch = employee && DB.branches.find(b=>b.id===employee.branchId);
    const from = leave.from || leave.leaveDate || '';
    const to = leave.to || leave.from || leave.leaveDate || '';
    return {...leave,
      applicantName: leave.applicantName || employee?.name || 'कर्मचारी उपलब्ध नाही',
      applicantCenter: leave.applicantCenter || branch?.name || 'केंद्र उपलब्ध नाही',
      submittedAt: leave.submittedAt || leave.createdAt || null,
      leaveDate: leave.leaveDate || (from && to ? `${from} ते ${to}` : 'दिनांक उपलब्ध नाही'),
      reason: leave.reason || 'कारण नमूद केलेले नाही',
      status: leave.status || 'प्रलंबित'
    };
  });
  delete DB['benefici'+'aries'];
  DB.announcements = Array.isArray(DB.announcements) ? DB.announcements : [];
  DB.notifications = Array.isArray(DB.notifications) ? DB.notifications : [];
}

async function loadDB(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    DB = JSON.parse(res.value);
  }catch(e){
    DB = seedData();
    await saveDB();
  }
  normalizeDB();
  await saveDB(); // Persist the current storage schema after normalization.
}
async function saveDB(){
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(DB), true); }
  catch(e){ console.error('storage save failed', e); }
}

    if(!regPhoto){ err.textContent='कृपया कर्मचारी फोटो घ्या.'; return; }
    const newEmp = {
      id: nextEmpId(), name, mobile, dob: dob||null, branchId, designation:desig,
      username, password:pass, status:'प्रलंबित', photo:regPhoto
    };
    DB.employees.push(newEmp);
    await saveDB();
    regPhoto = null;
    showRegister = false;
    loginRole = 'employee';
    root.innerHTML = loginView();
    attachLoginEvents();
    const errBox = document.getElementById('li-err');
    if(errBox){ errBox.className='login-ok'; errBox.textContent='नोंदणी यशस्वी झाली. प्रशासकाच्या मंजुरीनंतर तुम्ही लॉगिन करू शकाल.'; }
  };
}

function weekStats(employeeId){
  const result=[];
  for(let offset=6;offset>=0;offset--){
    const date=new Date(); date.setDate(date.getDate()-offset); const ds=date.toISOString().slice(0,10);
    const entry=DB.attendance[attKey(employeeId,ds)]; result.push({label:date.toLocaleDateString('mr-IN',{weekday:'short'}),present:!!(entry&&entry.checkIn)});
  }
  return result;
}
function requestLeave(){
  const from=window.prompt('रजा सुरू होण्याची तारीख (YYYY-MM-DD)');
  if(!from) return;
  const to=window.prompt('रजा संपण्याची तारीख (YYYY-MM-DD)',from);
  const reason=window.prompt('रजेचे कारण');
  if(!to||!reason) return;
  const employee = getEmp();
  const branch = employee && DB.branches.find(b=>b.id===employee.branchId);
  const submittedAt = new Date().toISOString();
  DB.leaves.push({id:'lv_'+Date.now(),employeeId:session.id,applicantName:employee?.name||'कर्मचारी उपलब्ध नाही',applicantCenter:branch?.name||'केंद्र उपलब्ध नाही',submittedAt,leaveDate:`${from} ते ${to}`,from,to,reason,status:'प्रलंबित'});
  saveDB().then(render);
}
function employeeInsights(emp){
  const stats=weekStats(emp.id); const worked=stats.filter(x=>x.present).length;
  const tasks=DB.tasks.filter(x=>(x.employeeId===emp.id||x.employeeId==='all') && (!x.due || x.due>=todayStr()));
  const leave=DB.leaves.filter(x=>x.employeeId===emp.id).slice(-1)[0];
  return `<div class="insight-grid" id="profile-panel"><section class="panel"><div class="toolbar"><h3>या आठवड्याची हजेरी</h3><span class="pill pill-done">${worked}/7 दिवस</span></div><div class="chart-bars">${stats.map(x=>`<div class="chart-bar"><i style="height:${x.present?'78':'14'}%"></i><span>${x.label}</span></div>`).join('')}</div></section><section class="panel" id="tasks-panel"><div class="toolbar"><h3>माझी कामे</h3><span class="pill pill-wait">${tasks.length} कामे</span></div>${tasks.length?tasks.map(x=>`<div class="notice"><b>${x.title}</b><small>${x.due?'अंतिम तारीख: '+fmtDate(x.due):'नियोजित काम'} · <span class="priority-${(x.priority||'medium').toLowerCase()}">${x.priority||'Medium'}</span></small>${x.audioData?`<audio class="task-audio" controls preload="metadata" src="${x.audioData}">तुमचा ब्राउझर ऑडिओ प्ले करू शकत नाही.</audio>`:''}<div class="task-actions" style="margin-top:9px;"><button class="small-btn ${x.status==='पूर्ण'?'approve':''}" data-task-status="${x.status==='पूर्ण'?'प्रलंबित':'पूर्ण'}" data-task-id="${x.id}">${x.status==='पूर्ण'?'↶ प्रलंबित':'✓ पूर्ण'}</button></div></div>`).join(''):'<div class="empty">सध्या कोणतेही काम दिलेले नाही.</div>'}</section></div><div class="module-grid"><section class="module-card"><strong>रजा व्यवस्थापन</strong><p>${leave?'शेवटची विनंती: '+leave.status:'तुमची रजा विनंती पाठवा.'}</p><button class="small-btn" id="emp-leave">रजेची विनंती</button></section><section class="module-card"><strong>घोषणा</strong><p>${DB.announcements[0]?.title||'नवीन घोषणा नाही'}</p><button class="small-btn" id="emp-notices">सर्व घोषणा</button></section><section class="module-card"><strong>माझे प्रोफाइल</strong><p>${emp.designation}<br>${emp.mobile}</p><button class="small-btn" id="emp-profile">प्रोफाइल पाहा</button></section></div>`;
}

function adminInsights(){
  const active = DB.employees.filter(e=>e.status==='सक्रिय');
  const stats = [];
  for(let offset=6; offset>=0; offset--){
    const date = new Date(); date.setDate(date.getDate()-offset);
    const ds = date.toISOString().slice(0,10);
    const present = active.filter(e=>DB.attendance[attKey(e.id,ds)]?.checkIn).length;
    stats.push({label:date.toLocaleDateString('mr-IN',{weekday:'short'}), pct:active.length ? Math.round(present/active.length*100) : 0});
  }
  const ranking = active.map(e=>{
    const score = Object.values(DB.work).filter(w=>w && w.employeeId===e.id)
      .reduce((total,w)=>total + (+w.newRegistrations||0) + (+w.newClaims||0) + (+w.formRenewals||0) + (+w.cardsIssued||0),0);
    return {name:e.name, score};
  }).sort((a,b)=>b.score-a.score).slice(0,5);
  const pendingLeaves = DB.leaves.filter(l=>l.status==='प्रलंबित').length;
  return `
    <div class="insight-grid">
      <section class="panel"><div class="toolbar"><h3>साप्ताहिक हजेरी</h3><span class="pill pill-done">${active.length} सक्रिय</span></div>
        <div class="chart-bars">${stats.map(s=>`<div class="chart-bar"><i style="height:${Math.max(s.pct,8)}%"></i><span>${s.label}</span></div>`).join('')}</div>
      </section>
      <section class="panel"><div class="toolbar"><h3>कामगिरी क्रमवारी</h3><span class="pill pill-wait">गुण</span></div>
        <div class="rank-list">${ranking.length ? ranking.map((r,index)=>`<div class="rank-item"><span class="rank-no">${index+1}</span><div><b>${r.name}</b><div class="progress"><i style="width:${ranking[0].score ? Math.round(r.score/ranking[0].score*100) : 0}%"></i></div></div><b>${r.score}</b></div>`).join('') : '<div class="empty">क्रमवारीसाठी अद्याप कामाची नोंद नाही.</div>'}</div>
      </section>
    </div>
    <div class="module-grid">
      <section class="module-card"><strong>कामे</strong><p>${DB.tasks.length} नियोजित कामे. कर्मचाऱ्यांना नवीन काम द्या.</p><button class="small-btn" data-admin-action="task">काम जोडा</button></section>
      <section class="module-card"><strong>रजा विनंत्या</strong><p>${pendingLeaves} प्रलंबित रजा विनंत्या आहेत.</p><button class="small-btn" data-admin-action="leave">विनंत्या पाहा</button></section>
    </div>`;
}

function attKey(empId, date){ return empId+'_'+date; }

function todayWork(){ return DB.work[attKey(session.id, todayStr())]; }

function employeeView(){

      <div class="status-row"><span>काम संपल्याची नोंद</span>${coDone?`<span class="pill pill-done">पूर्ण · ${fmtTime(new Date(att.checkOut.time))}</span>`:ciDone?`<span class="pill pill-wait">बाकी</span>`:`<span class="pill pill-pending">बाकी</span>`}</div>
      ${hrs!==null?`<div class="status-row"><span>एकूण कामाचे तास</span><b>${hrs.toFixed(1)} तास</b></div>`:''}

      <button class="action-btn ${!ciDone?'accent':''}" id="btn-checkin" ${ciDone?'disabled':''}><span class="ic">&#128308;</span>आज कामावर आलो</button>

    </div>

    ${document.body.dataset.showHist==='1' ? `
      <div id="history-wrap">
        ${myDates.length===0 ? '<div class="empty">अद्याप जुनी नोंद नाही.</div>' : myDates.map(ds=>{
          const a = DB.attendance[attKey(session.id, ds)];

function openCamera(purpose){
  camPurpose = purpose; capturedPhoto=null; gpsCoords=null; gpsError=null;
  render();
  startCameraStream();
  if(purpose!=='register') requestGPS();
}
function openWorkForm(){ camPurpose='work'; render(); }

function startCameraStream(){
  if(!navigator.mediaDevices?.getUserMedia){
    const camFrame = document.querySelector('.cam-frame');
    if(camFrame) camFrame.innerHTML = '<div style="padding:30px;text-align:center;color:var(--text-muted);font-size:13px;">या ब्राउझरमध्ये कॅमेरा उपलब्ध नाही. कृपया समर्थित ब्राउझर वापरा.</div>';
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}, audio:false}).then(stream=>{
    camStream = stream;
    const v = document.getElementById('cam-video');
    if(v){ v.srcObject = stream; }
  }).catch(()=>{
    const camFrame = document.querySelector('.cam-frame');

  });
}
function stopCameraStream(){ if(camStream){ camStream.getTracks().forEach(t=>t.stop()); camStream=null; } }
function requestGPS(){
  if(!navigator.geolocation){ gpsError='या browser मध्ये location सुविधा उपलब्ध नाही.'; updateGpsBox(); return; }
  navigator.geolocation.getCurrentPosition(pos=>{
    gpsCoords = {lat:pos.coords.latitude, lng:pos.coords.longitude};
    updateGpsBox();
  }, err=>{
    gpsError = 'Location मिळू शकले नाही. फोटो व वेळेसह नोंद पुढे सुरू ठेवता येईल.';
    updateGpsBox();
  }, {enableHighAccuracy:true, timeout:10000});
}
function updateGpsBox(){
  const box = document.getElementById('gps-box');
  if(!box) return;
  box.className = 'gps-box ' + (gpsCoords?'ok':(gpsError?'err':''));
  box.textContent = gpsCoords ? `स्थान नोंदवले: ${gpsCoords.lat.toFixed(5)}, ${gpsCoords.lng.toFixed(5)}` : (gpsError || 'तुमचे सध्याचे स्थान घेत आहोत…');
  const confirmBtn = document.getElementById('cam-confirm');
  if(confirmBtn) confirmBtn.disabled = !gpsCoords && !gpsError;
}

function attachModalEvents(){
  const backdrop = document.getElementById('modal-backdrop');
  if(!backdrop) return;
  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.onclick = closeModal;
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });

  const capBtn = document.getElementById('cam-capture');
  if(capBtn) capBtn.onclick = ()=>{
    const v = document.getElementById('cam-video');
    const c = document.getElementById('cam-canvas');
    if(!v || !v.videoWidth){ return; }
    if(!c) return;
    c.width = 320; c.height = 240;
    const ctx = c.getContext('2d');
    ctx.drawImage(v,0,0,320,240);
    capturedPhoto = c.toDataURL('image/jpeg', 0.6);
    stopCameraStream();
    render();
  };
  const retakeBtn = document.getElementById('cam-retake');
  if(retakeBtn) retakeBtn.onclick = ()=>{ capturedPhoto=null; render(); startCameraStream(); };
  const confirmBtn = document.getElementById('cam-confirm');
  if(confirmBtn) confirmBtn.onclick = async ()=>{
    if(camPurpose==='register'){
      regPhoto = capturedPhoto;
      camPurpose = null; capturedPhoto=null;
      showRegister = true;
      render();
      return;
    }
    if(!gpsCoords) return;
    const key = attKey(session.id, todayStr());
    if(!DB.attendance[key]) DB.attendance[key] = {employeeId:session.id, date:todayStr()};
    const entry = {time:new Date().toISOString(), lat:gpsCoords?.lat ?? null, lng:gpsCoords?.lng ?? null, photo:capturedPhoto, locationVerified:!!gpsCoords};
    if(camPurpose==='checkin') DB.attendance[key].checkIn = entry;
    else DB.attendance[key].checkOut = entry;
    await saveDB();
    closeModal();
    if(camPurpose==='checkout' && !DB.work[key]) openWorkForm();
  };

  const wfSubmit = document.getElementById('wf-submit');
  if(wfSubmit) wfSubmit.onclick = async ()=>{
    const regEl = document.getElementById('wf-reg');
    const claimsEl = document.getElementById('wf-claims');
    const renewEl = document.getElementById('wf-renew');
    const cardsEl = document.getElementById('wf-cards');
    const otherEl = document.getElementById('wf-other');
    if(!regEl || !claimsEl || !renewEl || !cardsEl || !otherEl) return;
    const reg = parseInt(regEl.value)||0;
    const cl = parseInt(claimsEl.value)||0;
    const rn = parseInt(renewEl.value)||0;
    const cd = parseInt(cardsEl.value)||0;
    const other = otherEl.value.trim();
    const key = attKey(session.id, todayStr());
    DB.work[key] = {employeeId:session.id, date:todayStr(), newRegistrations:reg, newClaims:cl, formRenewals:rn, cardsIssued:cd, otherWork:other};
    await saveDB();
    closeModal();
  };
}
function closeModal(){
  stopCameraStream();
  const wasRegister = camPurpose==='register';
  camPurpose=null; capturedPhoto=null; gpsCoords=null; gpsError=null;
  if(wasRegister && !session){ showRegister = true; }
  render();
}

function reportMonthOptions(){
  const options=[]; const base=localDateFromString(todayStr()); base.setDate(1);
  for(let offset=0; offset<18; offset++){
    const date=new Date(base.getFullYear(),base.getMonth()-offset,1);
    const value=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}`;
    options.push(`<option value="${value}" ${attendanceReportMonth===value?'selected':''}>${monthLabel(value)}</option>`);
  }
  return options.join('');
}
function approvedLeaveDates(employeeId, monthValue){
  const {year,month,lastDay}=monthRange(monthValue); const dates=new Set();
  const first=`${year}-${String(month).padStart(2,'0')}-01`; const last=`${year}-${String(month).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
  DB.leaves.filter(l=>l.employeeId===employeeId && ['मंजूर','approved'].includes(String(l.status).toLowerCase())).forEach(leave=>{
    if(!leave.from || !leave.to) return;
    const start=localDateFromString(leave.from); const end=localDateFromString(leave.to);
    for(let date=new Date(start);date<=end;date.setDate(date.getDate()+1)){
      const value=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
      if(dateInRange(value,first,last) && date.getDay()!==0) dates.add(value);
    }
  });
  return dates;
}
function attendanceMonthStats(employee, monthValue){
  const {year,month,lastDay}=monthRange(monthValue); const today=todayStr();
  const entries=[]; let present=0,totalHours=0,workedDays=0,workdays=0;
  const approvedLeaves=approvedLeaveDates(employee.id,monthValue);
  for(let day=1;day<=lastDay;day++){
    const date=new Date(year,month-1,day); const ds=`${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    if(ds>today) continue;
    const entry=DB.attendance[attKey(employee.id,ds)]; const isSunday=date.getDay()===0;
    const hours=hoursBetween(entry?.checkIn?.time,entry?.checkOut?.time);
    let status='गैरहजर';
    if(isSunday) status='साप्ताहिक सुट्टी';
    else if(entry?.checkIn){ status='उपस्थित'; present++; if(hours!==null){totalHours+=hours;workedDays++;} }
    else if(approvedLeaves.has(ds)) status='रजा';
    if(!isSunday) workdays++;
    entries.push({ds,entry,hours,status});
  }
  const leaveDays=approvedLeaves.size;
  const absent=Math.max(0,workdays-present-leaveDays);
  const percentage=workdays ? Math.round(present/workdays*100) : 0;
  return {entries,present,leaveDays,absent,percentage,avgHours:workedDays ? totalHours/workedDays : 0};
}
function attendanceBadge(percentage){ const level=percentage>85?'good':percentage>=70?'mid':'low'; return `<span class="attendance-badge attendance-${level}">${percentage}%</span>`; }

  const rows=['कर्मचारी क्रमांक,कर्मचारी नाव,केंद्र,महिना,उपस्थित दिवस,मंजूर रजा,गैरहजर दिवस,हजेरी टक्केवारी,सरासरी कामाचे तास'];

function centralReportRange(){
  if(centralReportMode==='daily') return {from:centralReportDate,to:centralReportDate,label:fmtDate(centralReportDate)};
  if(centralReportMode==='weekly') return {from:centralReportFrom,to:centralReportTo,label:`${fmtDate(centralReportFrom)} ते ${fmtDate(centralReportTo)}`};
  const month=centralReportMonth; const {year,month:monthNumber,lastDay}=monthRange(month);
  return {from:`${year}-${String(monthNumber).padStart(2,'0')}-01`,to:`${year}-${String(monthNumber).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`,label:monthLabel(month)};
}
function centralReportData(){
  const range=centralReportRange(); const query=centralReportSearch.trim().toLowerCase();
  const rows=DB.employees.filter(employee=>employee.status==='सक्रिय').map(employee=>{
    const branch=DB.branches.find(b=>b.id===employee.branchId); const branchName=branch?.name||'इतर केंद्रे';
    const entries=Object.values(DB.attendance).filter(entry=>entry && entry.employeeId===employee.id && dateInRange(entry.date,range.from,range.to));
    const present=entries.filter(entry=>entry.checkIn).length;
    const hours=entries.reduce((sum,entry)=>sum+(hoursBetween(entry.checkIn?.time,entry.checkOut?.time)||0),0);
    return {employee,branchName,present,hours,entries};
  }).filter(row=>!query || row.employee.name.toLowerCase().includes(query) || row.branchName.toLowerCase().includes(query));
  return {range,rows};
}

}

function setTaskRecordingMessage(message){
  const error = document.getElementById('task-error');
  if(error) error.textContent = message || '';
}
function stopTaskRecording(){
  if(taskRecorder && taskRecorder.state !== 'inactive') taskRecorder.stop();
}
function formatRecordingTime(seconds){ return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0'); }
function attachTaskEvents(){
  const recordBtn = document.getElementById('task-record');
  const stopBtn = document.getElementById('task-record-stop');
  if(recordBtn) recordBtn.onclick = async ()=>{
    setTaskRecordingMessage('');
    if(!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder){
      setTaskRecordingMessage('या ब्राउझरमध्ये व्हॉइस रेकॉर्डिंग उपलब्ध नाही. तुम्ही व्हॉइस नोटशिवाय काम नियुक्त करू शकता.');
      return;
    }
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      taskAudioChunks = [];
      taskRecorder = new MediaRecorder(stream);
      taskRecorder.ondataavailable = event=>{ if(event.data.size) taskAudioChunks.push(event.data); };
      taskRecorder.onerror = ()=>setTaskRecordingMessage('व्हॉइस रेकॉर्डिंग पूर्ण झाले नाही. कृपया पुन्हा प्रयत्न करा.');
      taskRecorder.onstop = ()=>{
        clearInterval(taskRecordingTimer); taskRecordingTimer=null; taskRecordingSeconds=0;
        stream.getTracks().forEach(track=>track.stop());
        const blob = new Blob(taskAudioChunks,{type:taskRecorder.mimeType || 'audio/webm'});
        if(!blob.size){ setTaskRecordingMessage('व्हॉइस नोट रिकामी आहे. कृपया पुन्हा रेकॉर्ड करा.'); return; }
        const reader = new FileReader();
        reader.onloadend = ()=>{
          taskAudioData = reader.result;
          const preview = document.getElementById('task-audio-preview');
          if(preview) preview.innerHTML = `<audio class="task-audio" controls src="${taskAudioData}"></audio><button class="small-btn" type="button" id="task-audio-remove">व्हॉइस नोट काढा</button>`;
          const removeBtn = document.getElementById('task-audio-remove');
          if(removeBtn) removeBtn.onclick=()=>{ taskAudioData=null; render(); };
        };
        reader.readAsDataURL(blob);
        taskRecorder = null;
        if(recordBtn) recordBtn.hidden=false;
        if(stopBtn) stopBtn.hidden=true;
        const timer = document.getElementById('task-record-timer'); if(timer) timer.hidden=true;
      };
      taskRecorder.start();
      taskRecordingSeconds=0;
      const timer = document.getElementById('task-record-timer');
      if(timer){ timer.textContent='00:00'; timer.hidden=false; }
      taskRecordingTimer=setInterval(()=>{ taskRecordingSeconds++; const current=document.getElementById('task-record-timer'); if(current) current.textContent=formatRecordingTime(taskRecordingSeconds); },1000);
      recordBtn.hidden=true;
      if(stopBtn) stopBtn.hidden=false;
    }catch(error){
      setTaskRecordingMessage(error?.name==='NotAllowedError' ? 'माईकची परवानगी नाकारली गेली. व्हॉइस नोटशिवाय काम नियुक्त करता येईल.' : 'माईक सुरू करता आला नाही. व्हॉइस नोटशिवाय काम नियुक्त करता येईल.');
    }
  };
  if(stopBtn) stopBtn.onclick = stopTaskRecording;
  const removeBtn = document.getElementById('task-audio-remove');
  if(removeBtn) removeBtn.onclick=()=>{ taskAudioData=null; render(); };
  const saveBtn = document.getElementById('task-save');
  if(saveBtn) saveBtn.onclick = async ()=>{
    const titleEl = document.getElementById('task-title');
    const employeeEl = document.getElementById('task-employee');
    const dueEl = document.getElementById('task-due');
    const priorityEl = document.getElementById('task-priority');
    const error = document.getElementById('task-error');
    if(!titleEl || !employeeEl || !dueEl || !priorityEl || !error) return;
    const title = titleEl.value.trim();
    if(!title){ error.textContent='कृपया कामाचे तपशील लिहा.'; return; }
    DB.tasks.push({id:'task_'+Date.now(), title, employeeId:employeeEl.value, due:dueEl.value||null, priority:priorityEl.value, status:'प्रलंबित', audioData:taskAudioData||null, createdAt:todayStr()});
    taskAudioData=null;
    await saveDB(); render();
  };
}

  if(searchInput) searchInput.oninput = (e)=>{ empSearch = e.target.value; renderAdminBodyOnly(); };
  const branchFilter = document.getElementById('emp-branch-filter');
  if(branchFilter) branchFilter.onchange = (e)=>{ empBranchFilter = e.target.value; render(); };
  const attendanceMonthFilter = document.getElementById('attendance-month-filter');
  if(attendanceMonthFilter) attendanceMonthFilter.onchange = e=>{ attendanceReportMonth=e.target.value; attendanceReportEmployeeId=null; render(); };
  const attendanceExport = document.getElementById('attendance-export');
  if(attendanceExport) attendanceExport.onclick = exportAttendanceReportCSV;
  document.querySelectorAll('[data-attendance-emp]').forEach(row=>row.onclick=()=>{ attendanceReportEmployeeId=row.dataset.attendanceEmp; render(); });
  const attendanceClose = document.getElementById('attendance-modal-close');
  if(attendanceClose) attendanceClose.onclick=()=>{ attendanceReportEmployeeId=null; render(); };
  const attendanceBackdrop = document.getElementById('attendance-modal-backdrop');
  if(attendanceBackdrop) attendanceBackdrop.addEventListener('click',event=>{ if(event.target===attendanceBackdrop){ attendanceReportEmployeeId=null; render(); }});
  document.querySelectorAll('[data-emp]').forEach(el=>{ el.onclick = event=>{ event.stopPropagation(); empDetailId = el.dataset.emp; render(); }; });
  const closeBtn = document.getElementById('modal-close');
  if(closeBtn) closeBtn.onclick = ()=>{ empDetailId=null; render(); };
  const backdrop = document.getElementById('modal-backdrop');
  if(backdrop) backdrop.addEventListener('click', e=>{ if(e.target===backdrop){ empDetailId=null; render(); }});
  document.querySelectorAll('[data-report-mode]').forEach(button=>button.onclick=()=>{ centralReportMode=button.dataset.reportMode; render(); });
  const centralDate = document.getElementById('central-report-date');
  if(centralDate) centralDate.onchange=event=>{ centralReportDate=event.target.value||todayStr(); render(); };
  const centralFrom = document.getElementById('central-report-from');
  if(centralFrom) centralFrom.onchange=event=>{ centralReportFrom=event.target.value||centralReportFrom; };
  const centralTo = document.getElementById('central-report-to');
  if(centralTo) centralTo.onchange=event=>{ centralReportTo=event.target.value||centralReportTo; };
  const centralApply = document.getElementById('central-report-apply');
  if(centralApply) centralApply.onclick=()=>{ if(centralReportFrom<=centralReportTo) render(); };
  const centralMonth = document.getElementById('central-report-month');
  if(centralMonth) centralMonth.onchange=event=>{ centralReportMonth=event.target.value; render(); };
  const centralSearch = document.getElementById('central-report-search');
  if(centralSearch) centralSearch.oninput=event=>{ centralReportSearch=event.target.value; render(); };
  const centralExport = document.getElementById('central-export');
  if(centralExport) centralExport.onclick=exportCentralReportsCSV;
  document.querySelectorAll('[data-approve]').forEach(el=>{
    el.onclick = async ()=>{
      const emp = DB.employees.find(x=>x.id===el.dataset.approve);
      if(emp){ emp.status='सक्रिय'; await saveDB(); render(); }
    };
  });
  document.querySelectorAll('[data-reject]').forEach(el=>{
    el.onclick = async ()=>{
      DB.employees = DB.employees.filter(x=>x.id!==el.dataset.reject);
      await saveDB(); render();
    };
  });
  document.querySelectorAll('[data-leave-approve]').forEach(el=>{
    el.onclick = async ()=>{
      const leave = DB.leaves.find(item=>item.id===el.dataset.leaveApprove);
      if(leave){ leave.status='मंजूर'; await saveDB(); render(); }
    };
  });
  document.querySelectorAll('[data-leave-reject]').forEach(el=>{
    el.onclick = async ()=>{
      const leave = DB.leaves.find(item=>item.id===el.dataset.leaveReject);
      if(leave){ leave.status='नाकार'; await saveDB(); render(); }
    };
  });
  const addBranchBtn = document.getElementById('add-branch-btn');
  if(addBranchBtn) addBranchBtn.onclick = async ()=>{
    const nameEl = document.getElementById('new-branch-name');
    const addrEl = document.getElementById('new-branch-address');
    const name = nameEl.value.trim();
    if(!name) return;
    DB.branches.push({id:'br_'+Date.now(), name, address:addrEl.value.trim()||'—', status:'सक्रिय'});
    await saveDB();
    render();
  };
  document.querySelectorAll('[data-admin-action]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(btn.dataset.adminAction==='task'){
        adminTab='tasks'; render();
      }else{
        adminTab='leave'; render();
      }
    };
  });
  attachTaskEvents();
}
function renderAdminBodyOnly(){
  const body = document.getElementById('admin-body');
  if(body) body.innerHTML = employeesTab();
  document.querySelectorAll('[data-emp]').forEach(el=>{ el.onclick = event=>{ event.stopPropagation(); empDetailId = el.dataset.emp; render(); }; });
  const si = document.getElementById('emp-search');
  if(si){ si.focus(); si.setSelectionRange(si.value.length, si.value.length); si.oninput = (e)=>{ empSearch=e.target.value; renderAdminBodyOnly(); }; }
  const bf = document.getElementById('emp-branch-filter');
  if(bf) bf.onchange = (e)=>{ empBranchFilter=e.target.value; render(); };
}
function exportCentralReportsCSV(){
  const {range,rows}=centralReportData();
  const csv=['कर्मचारी आयडी,कर्मचारी नाव,केंद्र,कालावधी,उपस्थित दिवस,कामाचे तास,पूर्ण कामे,प्रवास खर्च (₹)'];
  rows.forEach(row=>{
    const completed=DB.tasks.filter(task=>(task.employeeId===row.employee.id||task.employeeId==='all') && task.status==='पूर्ण' && dateInRange(task.createdAt||task.due||todayStr(),range.from,range.to)).length;
    const travel=DB.expenses?.filter(expense=>(!expense.employeeId||expense.employeeId===row.employee.id) && String(expense.type||expense.category||'').toLowerCase().includes('प्रवास') && dateInRange(expense.date||todayStr(),range.from,range.to)).reduce((sum,expense)=>sum+(Number(expense.amount)||0),0)||0;
    csv.push([row.employee.id,row.employee.name,row.branchName,range.label,row.present,row.hours.toFixed(1),completed,travel.toFixed(2)].map(value=>`"${String(value).replaceAll('"','""')}"`).join(','));
  });
  const blob=new Blob(['\uFEFF'+csv.join('\n')],{type:'text/csv;charset=utf-8;'}); const link=document.createElement('a'); link.href=URL.createObjectURL(blob); link.download=`nbss_ahaval_kendra_${range.from}_te_${range.to}.csv`; link.click(); URL.revokeObjectURL(link.href);
}

const origRender = render;
render = function(){ origRender(); attachModalEvents(); };

(async function init(){
  if(!root) return;
  session = null;
  showRegister = false;
  try{
    await loadDB();
    render();
  }catch(error){
    console.error('Application initialization failed:', error);
    root.innerHTML = loginView();
    attachLoginEvents();
  }
})();

/* ---------- "Home Screen वर Install करा" prompt (Android/Chrome) ---------- */
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.createElement('button');
  btn.textContent = '📲 Home Screen वर Install करा';
  btn.id = 'pwa-install-btn';
  btn.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;z-index:999;background:#1B3B36;color:#fff;border:none;border-radius:12px;padding:14px;font-size:14.5px;font-weight:700;font-family:"Noto Sans Devanagari",sans-serif;box-shadow:0 4px 14px rgba(0,0,0,0.25);max-width:400px;margin:0 auto;';
  btn.onclick = async ()=>{
    btn.remove();
    if(!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
  };
  document.body.appendChild(btn);
});
window.addEventListener('appinstalled', ()=>{
  const btn = document.getElementById('pwa-install-btn');
  if(btn) btn.remove();
});
</script>
